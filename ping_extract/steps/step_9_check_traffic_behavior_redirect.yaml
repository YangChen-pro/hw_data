step_id: step_9_check_traffic_behavior_redirect
name: "检查流行为重定向配置"
content: "执行display traffic behavior user-defined命令，查看流策略中流行为的具体配置。重点关注Redirect ip-nexthop字段，判断是否存在将报文重定向到其他下一跳的配置。"
type: diagnosis
skills:
  - skill_id: "display traffic behavior user-defined"
    inputs:
      behavior_name: "流行为名称（从step_8的Policy_Name关联获取）"
    selector:
    extraction_schema:
      - name: Redirect_nexthop
        description: "[custom] 流行为中Redirect ip-nexthop配置的下一跳IP地址。若存在重定向则为具体IP（如192.168.2.11），若无重定向则为空字符串"
        type: string
transitions:
  rules:
    - description: "流行为中无重定向配置（无Redirect ip-nexthop），报文正常转发"
      condition: "extracted.Redirect_nexthop == ''"
      next_node: CONCLUSION_ROUTE_OK
    - description: "流行为中存在Redirect ip-nexthop重定向，报文被重定向到其他下一跳，需进一步确认受影响流量范围"
      condition: "extracted.Redirect_nexthop != ''"
      next_node: step_10_check_classifier_acl
  on_error:
    handler_execution_failed: CONCLUSION_MANUAL_CHECK
    cli_command_execution_failed: CONCLUSION_MANUAL_CHECK
    parse_failure: CONCLUSION_MANUAL_CHECK
  default: CONCLUSION_MANUAL_CHECK