step_id: step_7_check_direct_route
name: "检查直连路由"
content: "在源端执行display ip routing-table ip-address命令，检查是否有到达对端IP的路由，以及是否为直连路由。回显中Proto字段为Direct表示直连路由；若无路由则命令输出为空。"
type: diagnosis
skills:
  - skill_id: "display ip routing-table"
    inputs:
      ip_address: "目标IP地址"
    selector:
    extraction_schema:
      - name: Proto
        description: "路由的协议类型，如Direct表示直连路由，Static表示静态路由，OSPF表示OSPF路由。若命令输出为空（无路由）则此字段为空字符串"
        type: string
transitions:
  rules:
    - description: "无路由（命令输出为空，未找到匹配路由）"
      condition: "extracted.Proto == ''"
      next_node: CONCLUSION_NO_ROUTE
    - description: "路由存在且为直连路由（Proto=Direct）"
      condition: "extracted.Proto == 'Direct'"
      next_node: step_8_check_policy_routing_applied
    - description: "路由存在但为非直连路由（如Static/OSPF等），可能导致报文无法从直连接口转发"
      condition: "extracted.Proto != 'Direct' and extracted.Proto != ''"
      next_node: CONCLUSION_ROUTE_NOT_DIRECT
  on_error:
    handler_execution_failed: CONCLUSION_MANUAL_CHECK
    cli_command_execution_failed: CONCLUSION_MANUAL_CHECK
    parse_failure: CONCLUSION_MANUAL_CHECK
  default: CONCLUSION_MANUAL_CHECK