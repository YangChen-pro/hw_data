step_id: step_24_configure_inbound_traffic_statistics
name: "配置SwitchA入方向ICMP流量统计"
content: "在SwitchA上配置流量分类、流量行为和流量策略，对入方向的ICMP报文进行流量统计，以便精确定位报文的丢包位置。需要创建ACL匹配ICMP报文，配置流量分类器匹配该ACL，配置流量行为统计，并将策略应用到接口入方向。"
type: config
skills:
  - skill_id: "acl number"
    inputs:
      acl_number: "3000"
      src_ip: "源IP地址"
      dst_ip: "目的IP地址"
    selector:
    extraction_schema: []
  - skill_id: "traffic classifier"
    inputs:
      classifier_id: "classifier_icmp_in"
      acl_number: "3000"
    selector:
    extraction_schema: []
  - skill_id: "traffic behavior"
    inputs:
      behavior_id: "behavior_icmp_in"
    selector:
    extraction_schema: []
  - skill_id: "traffic policy"
    inputs:
      policy_id: "policy_icmp_in"
      classifier_id: "classifier_icmp_in"
      behavior_id: "behavior_icmp_in"
    selector:
    extraction_schema: []
  - skill_id: "traffic-policy"
    inputs:
      policy_id: "policy_icmp_in"
      interface: "接口名称"
      direction: "inbound"
    selector:
    extraction_schema: []
transitions:
  rules:
    - description: "配置完成，进入SwitchB入方向流量统计配置"
      condition: ""
      next_node: step_25_configure_outbound_traffic_statistics
  on_error:
    handler_execution_failed: CONCLUSION_MANUAL_CHECK
    cli_command_execution_failed: CONCLUSION_MANUAL_CHECK
    parse_failure: CONCLUSION_MANUAL_CHECK
  default: CONCLUSION_MANUAL_CHECK
