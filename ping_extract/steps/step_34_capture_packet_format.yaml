step_id: step_34_capture_packet_format
name: "使用capture命令确认报文接收情况"
content: "在镜像获取报文无法实施时，使用capture-packet命令直接在接口上捕获报文并打印到终端，然后人工分析报文内容。执行capture-packet命令后，设备将捕获指定数量的报文并以十六进制格式输出。需人工逐字节分析报文内容，检查：VLAN标签是否正确、目的MAC是否为设备系统MAC地址、IP头checksum是否正确、ICMP checksum是否正确。注意：该命令仅在V100R006及之后版本支持。"
type: diagnosis
skills:
  - skill_id: "capture-packet interface GigabitEthernet destination terminal packet-num"
    inputs:
      interface: ""
      packet_num: "100"
    selector: ""
    extraction_schema: []
transitions:
  rules:
    - description: "capture-packet命令执行完成，需人工分析报文格式"
      condition: "True"
      next_node: CONCLUSION_PACKET_FORMAT_MANUAL_CHECK
  on_error:
    handler_execution_failed: CONCLUSION_MANUAL_CHECK
    cli_command_execution_failed: CONCLUSION_MANUAL_CHECK
    parse_failure: CONCLUSION_MANUAL_CHECK
  default: CONCLUSION_MANUAL_CHECK