step_id: step_20_check_cpu_defend_blacklist
name: "检查cpu-defend策略是否配置黑名单"
content: "执行display cpu-defend policy {policy-name}查看策略详情，检查Configuration中是否存在Blacklist字段。若出现'Blacklist N ACL number : XXXX'则表示配置了黑名单，记录关联的ACL编号。"
type: diagnosis
skills:
  - skill_id: "display cpu-defend policy"
    inputs:
      policy_name: "策略名称（来自上一步获取的Name字段）"
    selector:
    extraction_schema:
      - name: Blacklist
        description: "[custom] 黑名单配置行，如'Blacklist 1 ACL number : 3300'；若策略中未配置黑名单则为空字符串"
        type: string
transitions:
  rules:
    - description: "策略中配置了黑名单（Blacklist字段不为空），需进一步检查ACL内容是否命中对端IP"
      condition: "extracted.Blacklist != ''"
      next_node: step_21_check_blacklist_acl
    - description: "策略中未配置黑名单，继续下一步排查"
      condition: "extracted.Blacklist == ''"
      next_node: __NEED_FILL__
  on_error:
    handler_execution_failed: CONCLUSION_MANUAL_CHECK
    cli_command_execution_failed: CONCLUSION_MANUAL_CHECK
    parse_failure: CONCLUSION_MANUAL_CHECK
  default: CONCLUSION_MANUAL_CHECK
