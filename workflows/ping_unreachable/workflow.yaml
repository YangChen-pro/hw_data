---
workflow_id: wf_check_ping_command
name: Ping不通故障定位
version: '1.0'
input_schema:
- name: facts
  type: object
  required: false
  description: 整个链路上面通用的事实（通常是用户输入）。
  properties: []
- name: current_hop
  type: object
  required: true
  description: 当前正在检查的单个直连 hop，仅表达本跳的设备、接口和已知转发事实。
  properties:
  - name: hop_index
    type: integer
    required: true
    description: 当前正在检查的第几跳，用于让上层编排记录 hop 顺序。
  - name: current_device
    type: string
    required: true
    description: 当前 hop 的本端设备管理 IP。
  - name: peer_device
    type: string
    required: true
    description: 当前 hop 的对端设备管理 IP。
  - name: path_state
    type: string
    required: true
    description: 当前 hop 的拓扑解析状态，建议取值 resolved、partial、failed。
  - name: forwarding_mode
    type: string
    required: false
    description: 当前 hop 的预判转发模式，建议取值 l2 或 l3。
  - name: current_interface
    type: string
    required: false
    description: 当前 hop 的本端直连接口。
  - name: peer_interface
    type: string
    required: false
    description: 当前 hop 的对端直连接口。
  - name: vlan_id
    type: integer
    required: false
    description: 当前 hop 关联的 VLAN ID。
  - name: mac_out_interface
    type: string
    required: false
    description: 本端 MAC 表学习到的出接口。
  - name: eth_trunk_id
    type: string
    required: false
    description: 若当前 hop 经过 Eth-Trunk，可选填对应 Trunk ID。
  - name: route_out_interface
    type: string
    required: false
    description: 本端到当前 hop 对端三层邻接的三层出接口。
  - name: vlanif_interface
    type: string
    required: false
    description: 当前 hop 本端用于三层接口精确比对的 VLANIF 接口名。
  - name: peer_vlanif_interface
    type: string
    required: false
    description: 当前 hop 对端用于三层接口精确比对的 VLANIF 接口名。
  - name: next_hop_ip
    type: string
    required: false
    description: 当前 hop 做三层检查时使用的对端邻接 IP。
  - name: arp_mac
    type: string
    required: false
    description: 针对 next_hop_ip 学到的 MAC 地址，已知时可作为 ARP 或 MAC 一致性校验辅助信息。
start_node:
- step_id: step_1_check_port_vlan
  description: 二层接口 VLAN 配置与 VLANIF 地址一致性检查
- step_id: step_3_check_physical_link
  description: 物理链路完整性、接口状态与二层协议阻塞检查
- step_id: step_6_check_direct_route
  description: 直连路由可达性与策略路由重定向检查
- step_id: step_11_check_arp_learning
  description: ARP 学习状态与 MAC 出接口一致性检查
- step_id: step_13_check_cpu_defend_policy
  description: CPU 防攻击黑名单配置检查
- step_id: step_16_check_icmp_statistics_local
  description: ICMP 报文收发统计定位丢弃位置
- step_id: step_18_check_icmp_cpcar_statistics
  description: ICMP 报文 CPCAR 限速丢包检查
steps:
- step_1_check_port_vlan
- step_2_check_ip_interface
- step_3_check_physical_link
- step_4_check_vlanif_status
- step_5_check_layer2_blocking
- step_6_check_direct_route
- step_7_check_policy_routing_applied
- step_8_check_traffic_behavior_redirect
- step_9_check_classifier_acl
- step_10_check_redirect_acl_detail
- step_11_check_arp_learning
- step_12_check_mac_outbound
- step_13_check_cpu_defend_policy
- step_14_check_cpu_defend_blacklist
- step_15_check_blacklist_acl
- step_16_check_icmp_statistics_local
- step_17_check_icmp_statistics_peer
- step_18_check_icmp_cpcar_statistics
conclusions:
  CONCLUSION_HANDLER_EXECUTION_FAILED:
    level: warning
    message: 工作流处理器执行失败
    suggestion: 请检查 workflow 引擎运行状态、step 编排配置和执行上下文，然后重试
    repair_action: 
  CONCLUSION_CLI_COMMAND_EXECUTION_FAILED:
    level: warning
    message: 设备命令执行失败
    suggestion: 请检查设备连通性、认证权限、命令可用性与执行超时情况，然后重试
    repair_action: 
  CONCLUSION_PARSE_FAILURE:
    level: warning
    message: 命令回显解析失败
    suggestion: 请检查命令回显格式是否变化、解析 schema/selector 是否匹配，并修正后重试
    repair_action: 
  CONCLUSION_PORT_LINK_TYPE_MISMATCH:
    level: error
    message: 两端接口链路类型配置不一致，导致Ping不通
    suggestion: 检查两端接口的链路类型（Access、Trunk、Hybrid）是否符合当前 hop 的组网方式，并确保两端配置一致
    repair_action: 进入接口视图，根据实际组网需求修改接口链路类型，使两端接口类型保持一致
  CONCLUSION_PORT_ALLOWED_VLAN_MISMATCH:
    level: error
    message: 两端接口允许通过的VLAN配置不一致，导致Ping不通
    suggestion: 检查两端接口的 PVID 及允许通过的 VLAN 列表，确保当前 hop 所需 VLAN 在两端配置一致
    repair_action: 进入接口视图，根据实际组网需求调整允许通过的 VLAN 和缺省 VLAN 配置，使两端接口的 VLAN 配置保持一致
  CONCLUSION_IP_MISMATCH:
    level: error
    message: 两端VLANIF接口IP地址不在同一网段，无法直接通信，导致Ping不通
    suggestion: 检查两端VLANIF接口的IP地址和子网掩码，确认是否属于同一网段
    repair_action: 进入VLANIF接口视图，执行ip address命令修改IP地址，使两端处于同一网段
  CONCLUSION_PHYSICAL_LINK_FAULT:
    level: error
    message: Eth-Trunk 成员链路数量或状态异常，导致当前 hop 转发失败，Ping 不通
    suggestion: 检查两端 Eth-Trunk 成员接口总数与 Up 成员数是否一致，确认成员口配置与链路状态匹配
    repair_action: 在接口视图检查并修复异常成员口配置或链路状态，确保两端 Eth-Trunk 成员总数一致且至少有一条成员链路为 Up
  CONCLUSION_INTERFACE_DOWN:
    level: error
    message: VLANIF接口或物理接口为Down状态，导致Ping不通
    suggestion: 检查该VLAN下是否有成员接口Up，以及物理接口是否正常连接
    repair_action: 检查物理接口连接状态，在接口视图下执行undo shutdown命令使能接口；确认接口已加入正确VLAN
  CONCLUSION_PORT_BLOCKED:
    level: error
    message: 接口被STP/RRPP/Smart Link等二层协议阻塞，导致Ping不通
    suggestion: 检查STP（DISCARDING状态）、RRPP（BLOCKED状态）或Smart Link（Inactive状态）的配置，确认接口阻塞是否合理
    repair_action: 根据实际网络拓扑调整STP优先级或RRPP/Smart Link配置，解除不合理的接口阻塞
  CONCLUSION_NO_ROUTE:
    level: error
    message: 路由表中无对应目的地址的路由条目，报文无法转发，导致Ping不通
    suggestion: 检查路由协议配置是否正确，确认源端设备是否配置了正确的网关地址或到对端的回程路由
    repair_action: 
  CONCLUSION_ROUTE_NOT_DIRECT:
    level: error
    message: 到目的地址的路由为非直连路由，可能因最长匹配原则导致报文无法从直连接口转发
    suggestion: 检查路由表中是否存在掩码更长的非直连路由覆盖了直连路由，排查路由故障原因
    repair_action: 
  CONCLUSION_POLICY_ROUTE_REDIRECT:
    level: error
    message: 策略路由（流策略）将流量重定向到了错误的下一跳，导致Ping不通
    suggestion: 检查流策略中流行为的Redirect配置，确认重定向目的地址是否正确
    repair_action: 新建ACL匹配正常流量，新建流行为（动作为permit），在接口下取消原流策略绑定，重新调整流分类绑定顺序（先绑定正常流量的流分类和permit行为，再绑定重定向流分类），最后重新在接口调用流策略
  CONCLUSION_ARP_NOT_LEARNED:
    level: error
    message: ARP学习失败，直连地址的MAC地址尚未学习到（显示为Incomplete或无表项），导致Ping不通
    suggestion: 建议切换到 arp_learning_failure workflow 继续执行ARP学习失败专项排查，定位请求/应答在哪一段被丢弃或处理异常
    repair_action: 
  CONCLUSION_ARP_MAC_INTERFACE_MISSING:
    level: warning
    message: ARP或MAC表项缺少接口字段，无法完成ARP接口与MAC出接口一致性校验
    suggestion: 检查display arp与display mac-address输出是否完整，确认目的IP对应ARP表项和目的MAC对应MAC表项均存在且接口字段可识别
    repair_action: 补齐相关表项后重试；若持续缺失，请人工排查命令输出与解析模板
  CONCLUSION_ARP_MAC_INTERFACE_MISMATCH:
    level: error
    message: ARP表项接口与MAC地址表Learned-From接口不一致，当前hop存在二层转发路径异常风险
    suggestion: 排查是否存在环路、MAC漂移、错误VLAN或MAC冲突，确认流量实际入/出接口与直连拓扑一致
    repair_action: 修正异常二层拓扑或冲突MAC来源，确保ARP对应接口与MAC表学习出接口一致
  CONCLUSION_BLACKLIST_CONFIGURED:
    level: error
    message: 本端设备的 cpu-defend 黑名单中存在当前 hop 对端设备的 IP 地址，导致 ARP 应答报文被 CPU 丢弃，Ping 不通
    suggestion: 删除cpu-defend黑名单中对应IP条目，或调整cpu-defend策略使其不影响正常ARP报文处理
    repair_action: 在本端设备上进入 cpu-defend policy 视图（cpu-defend policy {策略名}），执行 undo blacklist {序号} 取消黑名单配置；或修改关联 ACL 规则，确保当前 hop 对端报文可被正常处理
  CONCLUSION_ICMP_BAD_CHECKSUM:
    level: error
    message: ICMP报文校验和错误（Bad checksum计数增加），报文在传输过程中数据损坏，导致Ping不通
    suggestion: 检查链路质量，排查可能导致报文损坏的物理层或链路层问题，如光模块故障、线缆损坏等
    repair_action: 更换或检修存在问题的物理链路；若问题持续，收集诊断信息并联系技术支持
  CONCLUSION_LINK_DROP:
    level: error
    message: ICMP 报文在当前 hop 直连链路上传输时被丢弃，导致 Ping 不通
    suggestion: 检查当前 hop 的物理链路、光模块、线缆和接口误码情况，并在必要时更换链路后重新进行 Ping 测试
    repair_action: 更换当前 hop 的异常传输链路；若无法立即更换，可重点检查该 hop 两端接口、光模块和线缆状态
  CONCLUSION_PACKET_DROPPED_ON_PEER:
    level: error
    message: ICMP 报文在对端设备入方向处理时被丢弃，本端设备出方向与对端设备入方向报文统计定位表明问题位于对端设备内部
    suggestion: 收集对端设备的诊断信息，检查是否存在 ACL、QoS 策略或协议栈异常导致入方向报文被丢弃
    repair_action: 检查对端设备上的 ACL、QoS 与协议栈状态；若仍无法定位，请联系华为技术支持
  CONCLUSION_CHECK_PACKET_TX_RX:
    level: warning
    message: 当前 hop 需要进一步判断报文收发情况
    suggestion: 建议对当前 hop 继续做报文收发观测（如接口入/出方向流量统计或抓包），持续发起 Ping 后对比两端收发计数，定位报文在哪一侧或哪一段丢失
    repair_action: 
  CONCLUSION_ICMP_CPCAR_DROP:
    level: error
    message: ICMP报文因CPCAR限速被丢弃，Drop(Packets)计数持续增加，导致Ping不通
    suggestion: 已适当增加ICMP CPCAR的CAR值，建议重新进行Ping测试验证问题是否解决，验证后恢复原CAR值
    repair_action: 在cpu-defend policy视图下执行car packet-type icmp cir命令调大ICMP限速值，并通过cpu-defend-policy global全局生效；验证Ping恢复后，建议逐步还原为原始CAR值以保障安全
