step_id: step_12_check_mac_outbound
name: "检查MAC地址出接口与ARP物理出接口是否一致"
content: "ARP学习正确后，执行display mac-address命令查看MAC表项，确认MAC地址的出接口（Learned-From字段）与ARP表中的物理出接口（INTERFACE字段）是否一致。若不一致，排查是否存在环路或MAC冲突。"
type: diagnosis
skills:
  - skill_id: "display mac-address"
    inputs:
      mac_address: "来自step_11提取的MAC_ADDRESS字段值"
    selector:
    extraction_schema:
      - name: Learned-From
        description: "MAC地址表中该MAC地址对应的出接口，需与ARP表中INTERFACE字段进行人工比对，判断是否一致"
        type: string
transitions:
  rules:
    - description: "获取到MAC地址出接口，需人工比对ARP与MAC出接口是否一致"
      condition: ""
      next_node: CONCLUSION_ARP_MAC_CHECK
  on_error:
    handler_execution_failed: CONCLUSION_MANUAL_CHECK
    cli_command_execution_failed: CONCLUSION_MANUAL_CHECK
    parse_failure: CONCLUSION_MANUAL_CHECK
  default: CONCLUSION_MANUAL_CHECK