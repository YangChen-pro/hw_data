step_id: step_22_check_icmp_statistics_switcha
name: "检查SwitchA侧ICMP报文收发统计"
content: "在源端SwitchA上执行display icmp statistics命令，查看ICMP报文收发情况。Output方向echo字段代表SwitchA发出的ICMP Echo Request（请求）报文数目，Input方向echo reply代表SwitchA收到的ICMP Echo Reply（应答）报文数目，bad checksum代表收到的校验错误报文数目。在Ping操作前后对比bad checksum计数是否持续增长：若持续增长，说明对端设备SwitchB的协议栈回应ICMP报文格式不正确。若echo与echo reply数目不一致，需在SwitchB上执行同样命令对比分析丢包位置。若echo与echo reply数目一致但Ping仍不通，需进行ICMP流量统计进一步排查。"
type: diagnosis
skills:
  - skill_id: "display icmp statistics"
    inputs: {}
    selector:
    extraction_schema:
      - name: bad_checksum_in
        description: "[custom] Input方向bad checksum字段计数，表示收到的校验错误ICMP报文数，持续增长说明对端协议栈报文格式不正确"
        type: integer
      - name: echo_out
        description: "[custom] Output方向echo字段计数，表示SwitchA发出的ICMP Echo Request报文数目"
        type: integer
      - name: echo_reply_in
        description: "[custom] Input方向echo reply字段计数，表示SwitchA收到的ICMP Echo Reply报文数目"
        type: integer
transitions:
  rules:
    - description: "bad checksum计数大于0，对端设备协议栈回应ICMP报文格式不正确"
      condition: "extracted.bad_checksum_in > 0"
      next_node: CONCLUSION_ICMP_BAD_CHECKSUM
    - description: "echo与echo reply数目不一致，需在SwitchB侧执行display icmp statistics进行对比分析"
      condition: "extracted.echo_out != extracted.echo_reply_in"
      next_node: step_23_check_icmp_statistics_switchb
    - description: "echo与echo reply数目一致但Ping仍不通，需进行流量统计进一步排查"
      condition: "extracted.echo_out == extracted.echo_reply_in"
      next_node: step_24_configure_inbound_traffic_statistics
  on_error:
    handler_execution_failed: CONCLUSION_MANUAL_CHECK
    cli_command_execution_failed: CONCLUSION_MANUAL_CHECK
    parse_failure: CONCLUSION_MANUAL_CHECK
  default: CONCLUSION_MANUAL_CHECK
