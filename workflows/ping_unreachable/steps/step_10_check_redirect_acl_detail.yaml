step_id: step_10_check_redirect_acl_detail
name: 检查对端重定向 ACL 是否覆盖当前 Ping 流量
content: 在对端设备执行 display acl <acl_number>，其中 acl_number 来自 step_9_check_classifier_acl
  提取的 if_match_acl。提取 ACL 规则中的源IP并与 current_hop.current_device 比对；若相同，说明该策略路由命中了当前
  Ping 源流量并触发重定向。
type: diagnosis
skills:
- skill_id: skill_display_acl
  target_device: peer_device
  inputs:
    acl_number:
      name: acl_number
      source_type: step_output
      source_key: state.results.step_9_check_classifier_acl.if_match_acl
      description: 引用上一步识别出的重定向 ACL 编号
  selector: 针对 {{ state.results.step_9_check_classifier_acl.if_match_acl }} 对应的 ACL
    规则，提取 rule、rule_source 与 rule_source_ip。
  extraction_schema:
  - name: rule
    type: string
    description: '[custom] ACL规则行内容，含source IP信息，如''rule 5 permit ip source 10.1.1.1
      0''；若无规则则为空'
  - name: rule_source
    type: string
    description: '[custom] ACL规则中source字段指定的源IP地址，如''10.1.1.1''。若无source限制则为空字符串'
transitions:
  rules:
  - description: ACL 规则源IP与 current_device 一致，可确认策略路由重定向是根因
    condition: extracted.rule_source == input.current_hop.current_device
    next_node: CONCLUSION_POLICY_ROUTE_REDIRECT
  on_error:
    handler_execution_failed: CONCLUSION_HANDLER_EXECUTION_FAILED
    cli_command_execution_failed: CONCLUSION_CLI_COMMAND_EXECUTION_FAILED
    parse_failure: CONCLUSION_PARSE_FAILURE
