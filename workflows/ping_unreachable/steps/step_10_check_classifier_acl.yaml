step_id: step_10_check_classifier_acl
name: "检查流分类和ACL确认受影响流量"
content: "执行display traffic classifier user-defined命令查看流分类中匹配的ACL编号，再执行display acl命令查看ACL规则中的源IP范围，确认哪些流量被策略路由重定向，从而定位受影响的具体流量。"
type: diagnosis
skills:
  - skill_id: "display traffic classifier user-defined"
    inputs: {}
    selector:
    extraction_schema:
      - name: if_match_acl
        description: "[custom] 流分类中if-match acl配置的ACL编号，如'3000'。若未找到则为空字符串"
        type: string
  - skill_id: "display acl"
    inputs:
      acl_number: "与流分类关联的ACL编号"
    selector:
    extraction_schema:
      - name: rule_source
        description: "[custom] ACL规则中source字段指定的源IP地址或网段，如'192.168.1.0 0.0.0.255'。若无source限制则为空字符串"
        type: string
transitions:
  rules:
    - description: "已确认受影响流量来源，策略路由重定向是ping不通的根因，需删除相关ACL规则或修改流策略"
      condition: ""
      next_node: CONCLUSION_POLICY_ROUTE_REDIRECT
  on_error:
    handler_execution_failed: CONCLUSION_MANUAL_CHECK
    cli_command_execution_failed: CONCLUSION_MANUAL_CHECK
    parse_failure: CONCLUSION_MANUAL_CHECK
  default: CONCLUSION_MANUAL_CHECK