step_id: step_19_check_cpu_defend_policy
name: "查看cpu-defend防攻击策略列表"
content: "执行display cpu-defend policy查看全局或各槽位调用的防攻击策略名称，为后续检查策略中是否配置黑名单做准备。回显中Name字段为策略名，Related slot字段为关联槽位（<>表示全局，<N>表示N号槽位）。"
type: diagnosis
skills:
  - skill_id: "display cpu-defend policy"
    inputs: {}
    selector:
    extraction_schema:
      - name: Name
        description: "防攻击策略名称，如test1或default"
        type: string
      - name: Related_slot
        description: "[custom] 策略关联的槽位，<>表示全局，<1>表示1号槽位"
        type: string
transitions:
  rules:
    - description: "获取到策略名称，继续检查策略是否配置黑名单"
      condition: ""
      next_node: step_20_check_cpu_defend_blacklist
  on_error:
    handler_execution_failed: CONCLUSION_MANUAL_CHECK
    cli_command_execution_failed: CONCLUSION_MANUAL_CHECK
    parse_failure: CONCLUSION_MANUAL_CHECK
  default: CONCLUSION_MANUAL_CHECK
