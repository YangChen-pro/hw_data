step_id: step_25_configure_outbound_traffic_statistics
name: "配置SwitchA出方向ICMP流量统计"
content: "在SwitchA上配置出方向的ICMP流量统计策略，匹配从SwitchA发出的ICMP报文，以便与入方向统计数据对比，精确定位丢包发生的方向和位置。"
type: config
skills:
  - skill_id: "acl number"
    inputs:
      acl_number: "3001"
      src_ip: "源IP地址"
      dst_ip: "目的IP地址"
    selector:
    extraction_schema: []
  - skill_id: "traffic classifier"
    inputs:
      classifier_id: "classifier_icmp_out"
      acl_number: "3001"
    selector:
    extraction_schema: []
  - skill_id: "traffic behavior"
    inputs:
      behavior_id: "behavior_icmp_out"
    selector:
    extraction_schema: []
  - skill_id: "traffic policy"
    inputs:
      policy_id: "policy_icmp_out"
      classifier_id: "classifier_icmp_out"
      behavior_id: "behavior_icmp_out"
    selector:
    extraction_schema: []
  - skill_id: "traffic-policy"
    inputs:
      policy_id: "policy_icmp_out"
      interface: "接口名称"
      direction: "outbound"
    selector:
    extraction_schema: []
transitions:
  rules:
    - description: "配置完成，重置流量统计计数器"
      condition: ""
      next_node: step_26_reset_traffic_statistics
  on_error:
    handler_execution_failed: CONCLUSION_MANUAL_CHECK
    cli_command_execution_failed: CONCLUSION_MANUAL_CHECK
    parse_failure: CONCLUSION_MANUAL_CHECK
  default: CONCLUSION_MANUAL_CHECK
