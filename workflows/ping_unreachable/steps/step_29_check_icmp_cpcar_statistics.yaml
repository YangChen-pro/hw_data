step_id: step_29_check_icmp_cpcar_statistics
name: "检查ICMP报文CPCAR统计丢包情况"
content: "在交换机上执行display cpu-defend statistics packet-type icmp all命令，查看ICMP报文的CPCAR统计情况。检查Drop(Packets)计数是否在增加：若Drop计数持续增加，说明ICMP报文因超出CPCAR限速被丢弃，需适当增加CAR值再进行Ping测试，最后建议恢复CAR值。须注意调整CPCAR不当将会影响网络业务，建议联系技术支持人员处理。旧版本设备（框式V100R002、盒式V100R005）请使用display cpu-defend icmp statistics all命令。"
type: diagnosis
skills:
  - skill_id: "display cpu-defend statistics packet-type icmp all"
    inputs: {}
    selector:
    extraction_schema:
      - name: drop_packets
        description: "[custom] Drop(Packets)列计数，表示因CPCAR限速被丢弃的ICMP报文数，若持续增加说明存在CAR丢包"
        type: integer
transitions:
  rules:
    - description: "Drop(Packets)计数大于0，ICMP报文因CPCAR限速被丢弃"
      condition: "extracted.drop_packets > 0"
      next_node: step_30_configure_icmp_cpcar_value
    - description: "Drop计数为0，无CPCAR丢包，需继续排查其他原因"
      condition: "extracted.drop_packets == 0"
      next_node: CONCLUSION_MANUAL_CHECK
  on_error:
    handler_execution_failed: CONCLUSION_MANUAL_CHECK
    cli_command_execution_failed: CONCLUSION_MANUAL_CHECK
    parse_failure: CONCLUSION_MANUAL_CHECK
  default: CONCLUSION_MANUAL_CHECK
