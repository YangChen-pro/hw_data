step_id: step_32_configure_port_mirroring
name: "配置端口镜像查看报文收发情况（低流量）"
content: "适用于端口流量不大的场景。通过配置端口镜像，将被测接口的双向报文复制到观察口，连接抓包工具后分析报文格式。步骤：a. 配置观察口（observe-port）；b. 在被测接口配置镜像口，获取双向报文（port-mirroring to observe-port both）。配置完成后，需人工分析镜像到的报文，检查：VLAN标签是否正确、目的MAC是否为设备系统MAC地址、IP头checksum是否正确、ICMP checksum是否正确。"
type: config
skills:
  - skill_id: "observe-port interface gigabitethernet"
    inputs:
      observe_port_id: "1"
      interface: ""
    extraction_schema: []
  - skill_id: "port-mirroring to observe-port both"
    inputs:
      observe_port_id: "1"
    extraction_schema: []
transitions:
  rules:
    - description: "端口镜像配置完成，需人工分析镜像报文格式"
      condition: "True"
      next_node: CONCLUSION_PACKET_FORMAT_MANUAL_CHECK
  on_error:
    handler_execution_failed: CONCLUSION_MANUAL_CHECK
    cli_command_execution_failed: CONCLUSION_MANUAL_CHECK
    parse_failure: CONCLUSION_MANUAL_CHECK
  default: CONCLUSION_MANUAL_CHECK