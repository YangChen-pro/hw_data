step_id: step_8_check_policy_routing_applied
name: "检查流策略应用记录"
content: "执行display traffic-policy applied-record命令，查看设备上是否有配置并应用了流策略。若输出中存在Policy Name字段则表示有流策略被应用，需进一步排查是否影响报文转发。"
type: diagnosis
skills:
  - skill_id: "display traffic-policy applied-record"
    inputs: {}
    selector:
    extraction_schema:
      - name: Policy_Name
        description: "[custom] 已应用的流策略名称，从输出中'Policy Name: xxx'行提取。若无任何流策略应用则为空字符串"
        type: string
transitions:
  rules:
    - description: "无流策略应用记录，策略路由不是问题根因"
      condition: "extracted.Policy_Name == ''"
      next_node: CONCLUSION_ROUTE_OK
    - description: "存在流策略应用记录，需进一步检查流行为是否包含重定向"
      condition: "extracted.Policy_Name != ''"
      next_node: step_9_check_traffic_behavior_redirect
  on_error:
    handler_execution_failed: CONCLUSION_MANUAL_CHECK
    cli_command_execution_failed: CONCLUSION_MANUAL_CHECK
    parse_failure: CONCLUSION_MANUAL_CHECK
  default: CONCLUSION_MANUAL_CHECK