step_id: step_33_configure_flow_mirroring
name: "配置流镜像查看报文收发情况（高流量）"
content: "适用于端口流量较大的场景。通过配置流镜像，对匹配ACL规则的ICMP报文进行镜像，复制到观察口后连接抓包工具分析。步骤：a. 配置观察口；b. 配置ACL规则匹配双向ICMP报文；c. 配置流分类，匹配ACL；d. 配置流行为，镜像到观察口；e. 配置流策略，关联流分类和流行为；f. 在接口上应用流策略（inbound和outbound）。配置完成后，需人工分析镜像报文，检查VLAN标签、目的MAC、IP checksum、ICMP checksum等字段。"
type: config
