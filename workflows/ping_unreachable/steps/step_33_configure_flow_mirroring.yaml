    inputs:
      observe_port_id: "1"
      interface: ""
    extraction_schema: []
  - skill_id: "acl number"
    inputs:
      acl_number: "3033"
    extraction_schema: []
  - skill_id: "rule permit icmp source destination"
    inputs:
