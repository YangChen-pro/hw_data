step_id: step_17_check_icmp_statistics_peer
name: 检查对端 ICMP 报文收发统计
content: 在对端设备上执行 display icmp statistics，对比 ICMP Echo Request 和 ICMP Echo Reply 的收发情况，用于判断报文是在链路上被丢弃还是在对端设备上被丢弃。
type: diagnosis
skills:
- skill_id: skill_display_icmp_statistics
  target_device: peer_device
  inputs: {}
  selector: null
  extraction_schema:
  - name: echo_in
    type: integer
    description: '[custom] Input方向echo字段计数，表示对端设备收到的ICMP Echo Request报文数目'
  - name: echo_reply_out
    type: integer
    description: '[custom] Output方向echo reply字段计数，表示对端设备回应的ICMP Echo Reply报文数目'
transitions:
  rules:
  - description: 如果 DeviceA（本端）发出的 echo 报文数目多于 DeviceB（对端）接收到的 echo 报文数目，说明报文在传输链路上被丢弃
    condition: state.results.step_16_check_icmp_statistics_local.echo_out > extracted.echo_in
    next_node: CONCLUSION_LINK_DROP
  - description: 如果 DeviceA（本端）发出的 echo 报文数目等于 DeviceB（对端）接收到的 echo 报文数目，但离开 DeviceB
      的 echo reply 报文数目少于进入 DeviceB 的 echo 报文数目，说明报文在 DeviceB 上被丢弃
    condition: state.results.step_16_check_icmp_statistics_local.echo_out == extracted.echo_in
      and extracted.echo_reply_out < extracted.echo_in
    next_node: CONCLUSION_PACKET_DROPPED_ON_PEER
  on_error:
    handler_execution_failed: CONCLUSION_HANDLER_EXECUTION_FAILED
    cli_command_execution_failed: CONCLUSION_CLI_COMMAND_EXECUTION_FAILED
    parse_failure: CONCLUSION_PARSE_FAILURE
