step_id: step_6_check_layer2_blocking
name: "检查二层协议是否阻塞接口"
content: "若VLANIF接口和物理接口均Up，检查设备上是否运行了STP、RRPP或Smart Link等二层协议，确认Ping业务经过的物理接口是否被阻塞。执行display stp brief查看STP状态（DISCARDING表示阻塞）；执行display rrpp verbose查看RRPP状态（Port status为BLOCKED表示阻塞）；执行display smart-link group all查看Smart Link组状态（State为Inactive表示阻塞）。若接口被阻塞，需修改相关配置。"
type: diagnosis
skills:
  - skill_id: "display stp brief"
    inputs: {}
    selector:
    extraction_schema:
      - name: stp_state
        description: "[custom] STP协议下接口的状态，DISCARDING表示接口被STP阻塞无法转发报文"
        type: string
  - skill_id: "display rrpp verbose"
    inputs: {}
    selector:
    extraction_schema:
      - name: rrpp_port_status
        description: "[custom] RRPP协议下接口的端口状态，BLOCKED表示接口被RRPP阻塞"
        type: string
  - skill_id: "display smart-link group all"
    inputs: {}
    selector:
    extraction_schema:
      - name: smart_link_state
        description: "[custom] Smart Link组的状态，Inactive表示该组接口处于阻塞状态"
        type: string
transitions:
  rules:
    - description: "存在接口被STP/RRPP/Smart Link阻塞（STP State为DISCARDING，RRPP Port status为BLOCKED，或Smart Link State为Inactive）"
      condition: "extracted.stp_state == 'DISCARDING' or extracted.rrpp_port_status == 'BLOCKED' or extracted.smart_link_state == 'Inactive'"
      next_node: CONCLUSION_PORT_BLOCKED
    - description: "所有接口均处于转发状态，物理链路正常"
      condition: "extracted.stp_state != 'DISCARDING' and extracted.rrpp_port_status != 'BLOCKED' and extracted.smart_link_state != 'Inactive'"
      next_node: CONCLUSION_PHYSICAL_LINK_OK
  on_error:
    handler_execution_failed: CONCLUSION_MANUAL_CHECK
    cli_command_execution_failed: CONCLUSION_MANUAL_CHECK
    parse_failure: CONCLUSION_MANUAL_CHECK
  default: CONCLUSION_MANUAL_CHECK