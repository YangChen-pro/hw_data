step_id: step_4_check_physical_link
name: "检查物理链路连接"
content: "检查设备接口指示灯状态（常灭表示无连接）；检查光纤或网线与网络部署要求是否一致；检查光纤光模块波长参数是否一致（建议使用华为认证光模块）。若通过Eth-Trunk接口连接，执行display eth-trunk trunk-id命令检查两端Eth-Trunk中加入的物理成员接口数量是否一致，不一致则需重新配置Eth-Trunk。"
type: diagnosis
skills:
  - skill_id: "display eth-trunk"
    inputs:
      trunk_id: ""
    selector:
    extraction_schema:
transitions:
  rules:
    - description: "物理链路连接异常（指示灯常灭/接口部署不符/光模块波长不匹配/Eth-Trunk两端成员接口数量不一致）"
      condition: ""
      next_node: CONCLUSION_PHYSICAL_LINK_FAULT
    - description: "物理链路连接正常，继续检查VLANIF接口状态"
      condition: ""
      next_node: step_5_check_vlanif_status
  on_error:
    handler_execution_failed: CONCLUSION_MANUAL_CHECK
    cli_command_execution_failed: CONCLUSION_MANUAL_CHECK
    parse_failure: CONCLUSION_MANUAL_CHECK
  default: CONCLUSION_MANUAL_CHECK