workflow_id: ap_offline_diagnosis
name: "AP下线故障诊断"
version: "1.0"
description: "针对华为AP设备下线问题的自动化诊断工作流，覆盖配置变更、License、心跳超时、设备硬件等场景"
input_schema: {}
start_node:
  - step_01_check_offline_reason

steps:
  - step_01_check_offline_reason
  - step_02_remove_blacklist
  - step_03_fix_static_ip
  - step_04_check_license
  - step_05_check_power_cable
  - step_06_check_network_packet_loss
  - step_07_check_cpu_defend
  - step_08_check_cpu_overload
  - step_09_check_storm_control
  - step_10_check_ip_conflict
  - step_11_check_tc_packet_flood
  - step_12_check_capwap_config
  - step_13_check_device_internal

conclusions:
  CONCLUSION_NO_ACTION_NEEDED:
    level: info
    message: "AP下线是预期操作（如配置变更、重启等），无需人工干预"
    suggestion: "无需操作，系统将自动恢复"
  CONCLUSION_AP_BLACKLISTED:
    level: error
    message: "AP被加入黑名单导致下线"
    suggestion: "检查黑名单原因，确认后执行 undo ap blacklist 命令移除"
  CONCLUSION_STATIC_IP_ERROR:
    level: error
    message: "AP静态IP配置错误或存在IP冲突"
    suggestion: "检查并修正静态IP配置，确保IP地址在网络规划范围内且无冲突"
  CONCLUSION_LICENSE_EXPIRED:
    level: error
    message: "AP License已过期"
    suggestion: "联系华为技术支持续期或更新License"
  CONCLUSION_LICENSE_INSUFFICIENT:
    level: error
    message: "AP License数量不足"
    suggestion: "购买并申请扩容AP License"
  CONCLUSION_AC_LICENSE_EXPIRED:
    level: error
    message: "AC License已过期"
    suggestion: "联系华为技术支持续期或更新AC License"
  CONCLUSION_WAC_LICENSE_EXPIRED:
    level: error
    message: "WAC License已过期"
    suggestion: "联系华为技术支持续期或更新WAC License"
  CONCLUSION_RTU_LICENSE_INSUFFICIENT:
    level: error
    message: "RTU License数量不足"
    suggestion: "购买并申请扩容RTU License"
  CONCLUSION_POWER_ISSUE:
    level: error
    message: "AP供电异常或不足"
    suggestion: "检查PoE交换机供电能力，确保供电功率满足AP需求"
  CONCLUSION_CABLE_FAULT:
    level: error
    message: "网线异常或断开"
    suggestion: "检查网线连接，更换故障网线"
  CONCLUSION_INSUFFICIENT_POWER:
    level: error
    message: "PoE供电功率不足"
    suggestion: "检查PoE交换机功率预算，考虑升级PoE交换机或使用外接电源"
  CONCLUSION_NETWORK_PACKET_LOSS:
    level: error
    message: "AP与AC之间存在网络丢包"
    suggestion: "排查网络链路质量，检查中间设备状态"
  CONCLUSION_CPU_DEFEND_OVERFLOW:
    level: error
    message: "CPU防攻击策略导致心跳报文被丢弃"
    suggestion: "调整CPU防攻击策略的CPCAR限速参数，确保CAPWAP报文正常转发"
  CONCLUSION_CPU_OVERLOAD:
    level: error
    message: "AC或AP的CPU过载"
    suggestion: "排查CPU占用高的原因，优化设备配置或升级设备"
  CONCLUSION_STORM_CONTROL:
    level: error
    message: "风暴控制抑制了心跳报文"
    suggestion: "调整风暴控制阈值或关闭风暴控制功能"
  CONCLUSION_STORM_CONTROL_ERROR_DOWN:
    level: error
    message: "接口因风暴控制进入Error-Down状态，心跳报文无法正常转发"
    suggestion: "先恢复接口状态，再检查是否存在广播或组播风暴"
    repair_action: "在接口视图执行 shutdown 和 undo shutdown 恢复端口；如需预防重复触发，可配置 error-down auto-recovery cause storm-control interval <seconds>"
  CONCLUSION_IP_CONFLICT:
    level: error
    message: "存在IP地址冲突"
    suggestion: "排查并解决IP地址冲突问题"
  CONCLUSION_TC_PACKET_FLOOD:
    level: error
    message: "存在TC报文泛洪"
    suggestion: "排查TC报文来源，优化生成树配置"
  CONCLUSION_CAPWAP_CONFIG_ERROR:
    level: error
    message: "CAPWAP配置不正确"
    suggestion: "检查并修正CAPWAP源接口、优先级、心跳间隔等配置"
  CONCLUSION_DEVICE_INTERNAL_ERROR:
    level: error
    message: "设备内部存在硬件或软件异常"
    suggestion: "收集设备日志，联系华为技术支持"
  CONCLUSION_RADIO_TYPE_MISMATCH:
    level: error
    message: "AP射频类型与AC配置不匹配"
    suggestion: "检查AP射频类型，调整AC配置以匹配AP"
  CONCLUSION_COUNTRY_CODE_MISMATCH:
    level: error
    message: "AP国家码与AC配置不匹配"
    suggestion: "检查AP国家码，调整AC配置以匹配AP"
  CONCLUSION_DTLS_INCOMPATIBLE:
    level: error
    message: "AP与AC的DTLS加密配置不兼容"
    suggestion: "检查AP和AC的DTLS版本和加密套件配置"
  CONCLUSION_RESET_BUTTON_PRESSED:
    level: error
    message: "AP的Reset按钮被按下"
    suggestion: "确认是否为误操作，如是则重新配置AP"
  CONCLUSION_AP_INTERFERENCE:
    level: error
    message: "AP受到严重射频干扰"
    suggestion: "排查干扰源，调整信道或功率配置"
  CONCLUSION_EXTREME_TEMPERATURE:
    level: error
    message: "AP工作环境温度超出正常范围"
    suggestion: "改善AP工作环境温度，确保在设备工作温度范围内"
  CONCLUSION_CENTRAL_AP_OFFLINE:
    level: error
    message: "中心AP掉线导致子AP下线"
    suggestion: "优先排查并解决中心AP的问题"
  CONCLUSION_CAPWAP_PSK_MISMATCH:
    level: error
    message: "AP与AC的CAPWAP预共享密钥不匹配"
    suggestion: "检查并统一AP和AC的CAPWAP预共享密钥配置"
  CONCLUSION_CAPWAP_LINK_DOWN:
    level: error
    message: "CAPWAP链路异常"
    suggestion: "排查CAPWAP链路，检查网络连通性"
  CONCLUSION_BATCH_DELETE:
    level: info
    message: "AP被批量删除操作下线"
    suggestion: "确认是否为预期操作，如需恢复则重新添加AP"
  CONCLUSION_NCE_DISCONNECTED:
    level: error
    message: "NCE与AC断开连接"
    suggestion: "排查NCE与AC之间的网络连通性"
  CONCLUSION_MANUAL_CHECK:
    level: warning
    message: "无法自动诊断，需要人工介入检查"
    suggestion: "收集设备日志和现场信息，联系华为技术支持"
