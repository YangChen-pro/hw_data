---
step_id: step_15_check_dot1x_quiet
name: 检查 802.1X 终端静默状态
content: 执行 display dot1x quiet-user all，按终端 MAC 地址检查是否处于 802.1X 静默状态。终端在短时间内连续认证失败达到一定次数后会进入静默状态，静默期内认证报文将被丢弃。
type: diagnosis
preconditions:
  rules:
  - description: 需要终端 MAC 地址才能在静默用户列表中查询。
    condition: input.facts.terminal_mac != ''
    on_fail:
      action: skip
skills:
- skill_id: skill_display_dot1x_quiet_user_all
  target_device: current_device
  inputs: {}
  selector: 按 {{ input.facts.terminal_mac }} 在静默用户列表中定位，提取剩余静默时间。
  extraction_schema:
  - name: is_quiet
    type: boolean
    description: 终端 MAC 是否处于静默状态
  - name: quiet_remain_time
    type: integer
    description: 剩余静默时间（秒）
transitions:
  rules:
  - description: 终端 MAC 处于静默状态。
    condition: extracted.is_quiet == true
    next_node: CONCLUSION_TERMINAL_QUIET
  on_error:
    handler_execution_failed: CONCLUSION_HANDLER_EXECUTION_FAILED
    cli_command_execution_failed: CONCLUSION_CLI_COMMAND_EXECUTION_FAILED
    parse_failure: CONCLUSION_PARSE_FAILURE
