---
step_id: step_1_check_vap_config
name: 检查 VAP 模板详细配置
content: 进入 VAP 模板视图执行 display this，检查 VAP 模板下绑定的安全模板（security-profile）和认证模板（authentication-profile）是否存在。
type: diagnosis
preconditions:
  rules:
  - description: 需要 step_0 提取的 VAP 模板名称才能进入模板视图。
    condition: state.results.step_0_check_vap_profile.vap_profile_name != ''
    on_fail:
      action: skip
skills:
- skill_id: skill_display_this_vap_profile
  target_device: current_device
  inputs:
    vap_profile_name:
      name: vap_profile_name
      source_type: step_output
      source_key: state.results.step_0_check_vap_profile.vap_profile_name
      description: 需要检查的 VAP 模板名称
  selector: null
  extraction_schema:
  - name: security_profile
    type: string
    description: VAP 模板绑定的安全模板名称，未绑定时返回空串
  - name: authentication_profile
    type: string
    description: VAP 模板绑定的认证模板名称，未绑定时返回空串
transitions:
  rules:
  - description: VAP 模板未绑定认证模板，认证流程无法完成。
    condition: extracted.authentication_profile == ''
    next_node: CONCLUSION_AUTH_PROFILE_MISSING
  - description: 802.1X 场景下 VAP 模板未绑定安全模板。
    condition: input.current_hop.auth_type == 'dot1x' and extracted.security_profile == ''
    next_node: CONCLUSION_SECURITY_PROFILE_MISSING
  - description: 802.1X 场景且安全模板已绑定，继续检查安全模板配置。
    condition: input.current_hop.auth_type == 'dot1x' and extracted.security_profile != '' and extracted.authentication_profile != ''
    next_node: step_3_check_security_profile
  - description: Portal 场景或其他场景，直接检查认证模板配置。
    condition: input.current_hop.auth_type != 'dot1x' and extracted.authentication_profile != ''
    next_node: step_2_check_auth_profile
  on_error:
    handler_execution_failed: CONCLUSION_HANDLER_EXECUTION_FAILED
    cli_command_execution_failed: CONCLUSION_CLI_COMMAND_EXECUTION_FAILED
    parse_failure: CONCLUSION_PARSE_FAILURE
