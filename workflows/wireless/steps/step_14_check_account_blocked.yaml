---
step_id: step_14_check_account_blocked
name: 检查认证账号是否被锁定
content: 执行 display remote-user authen-fail blocked，检查是否有远端认证账号因连续失败过多而被锁定。
type: diagnosis
skills:
- skill_id: skill_display_remote_user_authen_fail_blocked
  target_device: current_device
  inputs: {}
  selector: null
  extraction_schema:
  - name: blocked_user_count
    type: integer
    description: 被锁定的远端用户总数
  - name: blocked_users
    type: string
    description: 被锁定的用户名列表
transitions:
  rules:
  - description: 存在被锁定的认证账号。
    condition: extracted.blocked_user_count > 0
    next_node: CONCLUSION_ACCOUNT_BLOCKED
  on_error:
    handler_execution_failed: CONCLUSION_HANDLER_EXECUTION_FAILED
    cli_command_execution_failed: CONCLUSION_CLI_COMMAND_EXECUTION_FAILED
    parse_failure: CONCLUSION_PARSE_FAILURE
