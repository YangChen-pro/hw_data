step_id: step_10c_config_interconnect_hybrid_vlan
name: 配置互联侧端口（Hybrid）放行 VLAN
content: 在当前设备上将互联侧端口链路类型调整为 Hybrid，并根据 facts.hybrid_vlan_mode 选择 tagged 或 untagged 方式放行业务 VLAN。完成后继续重新检查 MAC 地址表项。
type: configuration
preconditions:
  rules:
  - description: 互联侧端口 Hybrid 配置需要 interconnect_interface、vlan_id 和 hybrid_vlan_mode。
    condition: input.current_hop.interconnect_interface != '' and input.current_hop.vlan_id and (input.facts.hybrid_vlan_mode == 'tagged' or input.facts.hybrid_vlan_mode == 'untagged')
    on_fail:
      action: skip
      next_node: CONCLUSION_MANUAL_CHECK
skills:
- skill_id: skill_port_link_type_hybrid
  target_device: current_device
  inputs:
    interface_name:
      name: interface_name
      source_type: workflow_input
      source_key: input.current_hop.interconnect_interface
      description: 需要改为 Hybrid 类型的互联侧端口
  selector: null
  extraction_schema: []
- skill_id: skill_port_hybrid_vlan
  target_device: current_device
  inputs:
    interface_name:
      name: interface_name
      source_type: workflow_input
      source_key: input.current_hop.interconnect_interface
      description: 需要放行业务 VLAN 的互联侧端口
    vlan_id:
      name: vlan_id
      source_type: workflow_input
      source_key: input.current_hop.vlan_id
      description: 需要放行的目标 VLAN ID
    hybrid_vlan_mode:
      name: hybrid_vlan_mode
      source_type: workflow_input
      source_key: input.facts.hybrid_vlan_mode
      description: Hybrid 接口的放行方式，tagged 或 untagged
  selector: null
  extraction_schema: []
transitions:
  rules:
  - description: 互联侧端口 Hybrid 配置完成，继续重新检查 MAC 地址表项。
    condition: True
    next_node: step_11_recheck_mac_address_table
  on_error:
    handler_execution_failed: CONCLUSION_HANDLER_EXECUTION_FAILED
    cli_command_execution_failed: CONCLUSION_CLI_COMMAND_EXECUTION_FAILED
    parse_failure: CONCLUSION_PARSE_FAILURE
