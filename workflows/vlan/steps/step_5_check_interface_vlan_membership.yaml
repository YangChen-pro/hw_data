---
step_id: step_5_check_interface_vlan_membership
name: 检查接入侧端口 VLAN 成员关系
content: 在当前设备执行 display port vlan，按 current_hop.current_interface 聚焦接入侧端口，并结合 current_hop.vlan_id 判断目标 VLAN 是否允许在该接口正常通过。若未通过，则直接根据当前 link_type 进入 Access/Trunk/Hybrid 对应的 VLAN 修正分支；若已通过，则继续检查互联侧端口放行情况。
type: diagnosis
preconditions:
  rules:
  - description: 需要 current_hop.current_interface 和 current_hop.vlan_id 才能检查接入侧端口的 VLAN 成员关系。
    condition: input.current_hop.current_interface != '' and input.current_hop.vlan_id
    on_fail:
      action: skip
      next_node: CONCLUSION_MANUAL_CHECK
skills:
- skill_id: skill_display_port_vlan
  target_device: current_device
  inputs:
    interface_name:
      name: interface_name
      source_type: workflow_input
      source_key: input.current_hop.current_interface
      description: 需要检查 VLAN 成员关系的接入侧端口
  selector: 按 {{ input.current_hop.current_interface }} 在 port_vlan_table 中定位接入侧端口对应行，并结合目标 VLAN {{ input.current_hop.vlan_id }} 判断 target_vlan_allowed。
  extraction_schema:
  - name: link_type
    type: string
    description: 接入侧端口链路类型，如 Access、Trunk 或 Hybrid
  - name: pvid
    type: integer
    description: 接入侧端口 PVID
  - name: trunk_vlan_list
    type: string
    description: 接入侧端口允许通过的 VLAN 列表
  - name: target_vlan_allowed
    type: boolean
    description: 目标 VLAN 是否允许在当前接入侧端口正常通过
transitions:
  rules:
  - description: 接入侧端口已正确放行业务 VLAN，继续检查互联侧端口的 VLAN 放行情况。
    condition: extracted.target_vlan_allowed == true
    next_node: step_10_check_interconnect_vlan_pass
  - description: 接入侧端口为 Access 类型且未放行业务 VLAN，进入接入侧端口 Access 配置。
    condition: extracted.target_vlan_allowed == false and extracted.link_type == 'access'
    next_node: step_7_config_access_port_vlan
  - description: 接入侧端口为 Trunk 类型且未放行业务 VLAN，进入接入侧端口 Trunk 配置。
    condition: extracted.target_vlan_allowed == false and extracted.link_type == 'trunk'
    next_node: step_8_config_trunk_port_vlan
  - description: 接入侧端口为 Hybrid 类型且未放行业务 VLAN，进入接入侧端口 Hybrid 配置。
    condition: extracted.target_vlan_allowed == false and extracted.link_type == 'hybrid'
    next_node: step_9_config_hybrid_port_vlan
  - description: 接入侧端口 VLAN 未放通，但链路类型不在已建模范围内，转人工核查。
    condition: extracted.target_vlan_allowed == false and extracted.link_type != 'access' and extracted.link_type != 'trunk' and extracted.link_type != 'hybrid'
    next_node: CONCLUSION_MANUAL_CHECK
  on_error:
    handler_execution_failed: CONCLUSION_HANDLER_EXECUTION_FAILED
    cli_command_execution_failed: CONCLUSION_CLI_COMMAND_EXECUTION_FAILED
    parse_failure: CONCLUSION_PARSE_FAILURE
