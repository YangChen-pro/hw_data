---
step_id: step_15_check_lnp_interface_status
name: 检查 LNP 相关接口状态
content: 在当前设备执行 display interface，按 current_hop.current_interface 聚焦 LNP 相关接口。若接口 current_state 为 UP，则继续检查 link-type；否则可确认接口或链路异常导致 LNP 协商失败。
type: diagnosis
preconditions:
  rules:
  - description: LNP 分支需要 current_hop.current_interface 作为接口检查锚点。
    condition: input.current_hop.current_interface != ''
    on_fail:
      action: skip
      next_node: CONCLUSION_MANUAL_CHECK
skills:
- skill_id: skill_display_interface
  target_device: current_device
  inputs:
    interface_name:
      name: interface_name
      source_type: workflow_input
      source_key: input.current_hop.current_interface
      description: 需要检查状态的 LNP 相关接口
  selector: 聚焦接口 {{ input.current_hop.current_interface }} 的回显，并提取 current_state。
  extraction_schema:
  - name: current_state
    type: string
    description: 接口当前状态，UP 表示接口正常
transitions:
  rules:
  - description: LNP 相关接口状态为 UP，继续检查接口 link-type 配置。
    condition: extracted.current_state == 'UP'
    next_node: step_16_check_lnp_link_type
  - description: LNP 相关接口状态不是 UP，说明接口或链路异常导致协商失败。
    condition: extracted.current_state != 'UP'
    next_node: CONCLUSION_LNP_INTERFACE_DOWN
  on_error:
    handler_execution_failed: CONCLUSION_HANDLER_EXECUTION_FAILED
    cli_command_execution_failed: CONCLUSION_CLI_COMMAND_EXECUTION_FAILED
    parse_failure: CONCLUSION_PARSE_FAILURE
