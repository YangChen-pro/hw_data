step_id: step_10a_config_interconnect_access_vlan
name: 配置互联侧端口（Access）加入 VLAN
content: 在当前设备上将互联侧端口链路类型调整为 Access，并通过 port default vlan 将该端口加入目标 VLAN。完成后继续重新检查 MAC 地址表项。
type: configuration
preconditions:
  rules:
  - description: 互联侧端口 Access 配置需要 interconnect_interface 和 vlan_id。
    condition: input.current_hop.interconnect_interface != '' and input.current_hop.vlan_id
    on_fail:
      action: skip
      next_node: CONCLUSION_MANUAL_CHECK
skills:
- skill_id: skill_port_link_type_access
  target_device: current_device
  inputs:
    interface_name:
      name: interface_name
      source_type: workflow_input
      source_key: input.current_hop.interconnect_interface
      description: 需要改为 Access 类型的互联侧端口
  selector: null
  extraction_schema: []
- skill_id: skill_port_default_vlan
  target_device: current_device
  inputs:
    interface_name:
      name: interface_name
      source_type: workflow_input
      source_key: input.current_hop.interconnect_interface
      description: 需要加入 VLAN 的互联侧端口
    vlan_id:
      name: vlan_id
      source_type: workflow_input
      source_key: input.current_hop.vlan_id
      description: 需要加入的目标 VLAN ID
  selector: null
  extraction_schema: []
transitions:
  rules:
  - description: 互联侧端口 Access 配置完成，继续重新检查 MAC 地址表项。
    condition: True
    next_node: step_11_recheck_mac_address_table
  on_error:
    handler_execution_failed: CONCLUSION_HANDLER_EXECUTION_FAILED
    cli_command_execution_failed: CONCLUSION_CLI_COMMAND_EXECUTION_FAILED
    parse_failure: CONCLUSION_PARSE_FAILURE
