<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ping不通故障定位-检查Ping命令是否合理</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: rgba(255, 255, 255, 0.88);
      --panel-strong: #ffffff;
      --border: rgba(148, 163, 184, 0.22);
      --text: #0f172a;
      --muted: #475569;
      --subtle: #64748b;
      --primary: #2563eb;
      --primary-soft: rgba(37, 99, 235, 0.12);
      --success: #0f766e;
      --success-soft: rgba(15, 118, 110, 0.12);
      --warning: #d97706;
      --warning-soft: rgba(217, 119, 6, 0.14);
      --critical: #dc2626;
      --critical-soft: rgba(220, 38, 38, 0.14);
      --neutral-soft: rgba(100, 116, 139, 0.10);
      --shadow: 0 18px 42px rgba(15, 23, 42, 0.08);
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --header-h: 170px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.08), transparent 28%),
        radial-gradient(circle at top right, rgba(15, 118, 110, 0.10), transparent 32%),
        linear-gradient(180deg, #f8fbff 0%, #eef3fb 100%);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", ui-sans-serif, sans-serif;
      overflow-x: hidden;
      overflow-y: hidden;
    }

    button, input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      background: none;
    }

    .app {
      width: 100%;
      min-width: 0;
      min-height: 100dvh;
      height: 100dvh;
      padding: 14px 14px 16px;
      box-sizing: border-box;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .hero {
      margin: 0;
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 26px;
      background: linear-gradient(135deg, rgba(255,255,255,0.96), rgba(247,250,255,0.92));
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(260px, 0.7fr);
      gap: 16px;
      min-width: 0;
    }

    .hero > * {
      min-width: 0;
      min-height: 0;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--subtle);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .title {
      margin: 0 0 8px;
      font-size: clamp(24px, 2.2vw, 34px);
      line-height: 1.18;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .meta-row {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .start-fold {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(248, 250, 252, 0.84);
      min-width: 0;
    }

    .start-fold > summary {
      list-style: none;
      cursor: pointer;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
      overflow-wrap: anywhere;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .start-fold > summary::-webkit-details-marker {
      display: none;
    }

    .start-fold .start-list {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 12px;
      line-height: 1.3;
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
      white-space: normal;
    }

    .pill.neutral { background: var(--neutral-soft); color: var(--subtle); border-color: rgba(100, 116, 139, 0.16); }
    .pill.primary { background: var(--primary-soft); color: var(--primary); border-color: rgba(37, 99, 235, 0.18); }
    .pill.success { background: var(--success-soft); color: var(--success); border-color: rgba(15, 118, 110, 0.18); }
    .pill.warning { background: var(--warning-soft); color: var(--warning); border-color: rgba(217, 119, 6, 0.18); }
    .pill.critical { background: var(--critical-soft); color: var(--critical); border-color: rgba(220, 38, 38, 0.18); }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      align-content: start;
    }

    .stat {
      padding: 11px 12px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: rgba(248, 250, 252, 0.90);
    }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .main {
      min-height: 0;
      width: 100%;
      margin: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(320px, 28vw, 360px);
      gap: 16px;
    }

    .panel {
      width: 100%;
      min-width: 0;
      min-height: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .graph-panel {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    .graph-head {
      padding: 10px 14px 6px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      min-width: 0;
    }

    .graph-head > * {
      min-width: 0;
    }

    .graph-head-title {
      margin: 0 0 6px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
    }

    .graph-head-note {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .graph-actions {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .graph-btn {
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      background: rgba(255,255,255,0.92);
      color: var(--text);
      font-size: 12px;
      line-height: 1.2;
      box-shadow: 0 8px 16px rgba(15, 23, 42, 0.04);
    }

    .graph-btn:hover {
      border-color: rgba(37, 99, 235, 0.30);
    }

    .graph-info {
      padding: 0 14px 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .graph-stage-shell {
      position: relative;
      min-height: 0;
      margin: 0 12px 10px;
      border-radius: 20px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.88), rgba(247,250,255,0.96)),
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.08), transparent 20%),
        radial-gradient(circle at bottom right, rgba(15, 118, 110, 0.08), transparent 20%);
      overflow: hidden;
      touch-action: none;
    }

    .graph-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: grab;
    }

    .graph-viewport.dragging {
      cursor: grabbing;
    }

    .graph-stage {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    .graph-edge-layer,
    .graph-node-layer {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }

    .graph-edge-layer {
      pointer-events: none;
    }

    .graph-node-layer {
      pointer-events: auto;
    }

    .graph-node {
      position: absolute;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 11px 12px 10px;
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      background: rgba(255,255,255,0.95);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.07);
      text-align: left;
      min-width: 0;
      overflow: hidden;
      pointer-events: auto;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, opacity .18s ease, filter .18s ease;
    }

    .graph-node::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 4px;
      height: 100%;
      background: var(--state-line, rgba(100, 116, 139, 0.45));
    }

    .graph-node.step { --state-line: rgba(37, 99, 235, 0.55); }
    .graph-node.conclusion { --state-line: rgba(15, 118, 110, 0.55); }
    .graph-node.status-neutral { --state-line: rgba(100, 116, 139, 0.45); }
    .graph-node.status-info { --state-line: rgba(37, 99, 235, 0.55); }
    .graph-node.status-warning { --state-line: rgba(217, 119, 6, 0.62); }
    .graph-node.status-critical { --state-line: rgba(220, 38, 38, 0.68); }

    .graph-node:hover {
      transform: translateY(-1px);
      border-color: rgba(37, 99, 235, 0.28);
      box-shadow: 0 16px 30px rgba(37, 99, 235, 0.10);
    }

    .graph-node.selected {
      border-color: rgba(37, 99, 235, 0.44);
      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.14),
        0 20px 38px rgba(37, 99, 235, 0.16);
      transform: translateY(-2px);
    }

    .graph-node.related {
      border-color: rgba(15, 118, 110, 0.30);
      box-shadow: 0 14px 26px rgba(15, 118, 110, 0.08);
    }

    .graph-node.muted {
      opacity: 0.14;
      filter: grayscale(0.35) saturate(0.50);
      background: rgba(255, 255, 255, 0.64);
      border-style: dashed;
      box-shadow: none;
    }

    .graph-node.muted .badge-row {
      display: none;
    }

    .graph-node.focus {
      z-index: 4;
      transform: translateY(-4px) scale(1.03);
    }

    .graph-node .node-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: flex-start;
      min-width: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.3;
    }

    .graph-node .node-top span {
      min-width: 0;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .graph-node .node-title {
      margin: 0;
      font-size: 14px;
      line-height: 1.32;
      font-weight: 700;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .graph-node.muted .node-title {
      font-size: 12px;
      line-height: 1.25;
      font-weight: 600;
      display: -webkit-box;
      line-clamp: 1;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 11px;
      line-height: 1.3;
      white-space: normal;
      overflow-wrap: anywhere;
      min-width: 0;
      max-width: 100%;
    }

    .badge.neutral { background: var(--neutral-soft); color: var(--subtle); border-color: rgba(100, 116, 139, 0.14); }
    .badge.primary { background: var(--primary-soft); color: var(--primary); border-color: rgba(37, 99, 235, 0.18); }
    .badge.success { background: var(--success-soft); color: var(--success); border-color: rgba(15, 118, 110, 0.18); }
    .badge.warning { background: var(--warning-soft); color: var(--warning); border-color: rgba(217, 119, 6, 0.18); }
    .badge.info { background: var(--primary-soft); color: var(--primary); border-color: rgba(37, 99, 235, 0.18); }
    .badge.critical { background: var(--critical-soft); color: var(--critical); border-color: rgba(220, 38, 38, 0.18); }

    .graph-edge {
      pointer-events: auto;
    }

    .graph-edge .edge-line {
      fill: none;
      stroke: rgba(71, 85, 105, 0.20);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke .18s ease, stroke-width .18s ease, opacity .18s ease;
    }

    .graph-edge .edge-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 16;
      cursor: pointer;
      pointer-events: stroke;
    }

    .graph-edge .edge-label rect {
      fill: rgba(255,255,255,0.90);
      stroke: rgba(148, 163, 184, 0.16);
      stroke-width: 1;
      rx: 8;
    }

    .graph-edge .edge-label text {
      font-size: 10px;
      fill: var(--muted);
    }

    .graph-edge.selected .edge-line {
      stroke: var(--primary);
      stroke-width: 3.4;
    }

    .graph-edge.related .edge-line {
      stroke: rgba(15, 118, 110, 0.54);
      stroke-width: 2.7;
    }

    .graph-edge.muted {
      opacity: 0.12;
    }

    .graph-edge.muted .edge-line {
      stroke: rgba(100, 116, 139, 0.16);
      stroke-width: 1.2;
    }

    .graph-edge.selected .edge-label {
      opacity: 1;
    }

    .graph-edge.related .edge-label {
      opacity: 0.88;
    }

    .graph-edge.muted .edge-label {
      opacity: 0.08;
    }

    .graph-foot {
      padding: 0 16px 14px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .detail-panel {
      min-width: 0;
      min-height: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .detail-inner {
      min-width: 0;
      min-height: 0;
      flex: 1 1 auto;
      width: 100%;
      box-sizing: border-box;
      overflow-y: auto;
      overflow-x: visible;
      scrollbar-gutter: stable;
      overscroll-behavior: contain;
      padding: 16px 26px 36px 16px;
    }

    .detail-head {
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
    }

    .detail-head h2 {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.28;
      overflow-wrap: anywhere;
    }

    .detail-head p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .detail-banner {
      margin-bottom: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid transparent;
      font-size: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .detail-banner.critical {
      background: rgba(254, 242, 242, 0.96);
      border-color: rgba(220, 38, 38, 0.18);
      color: #991b1b;
    }

    .detail-banner.warning {
      background: rgba(255, 251, 235, 0.96);
      border-color: rgba(217, 119, 6, 0.18);
      color: #92400e;
    }

    .detail-banner.info {
      background: rgba(239, 246, 255, 0.96);
      border-color: rgba(37, 99, 235, 0.18);
      color: #1d4ed8;
    }

    .detail-stack {
      display: grid;
      gap: 12px;
      min-width: 0;
      overflow-x: visible;
      padding-bottom: 16px;
    }

    .detail-section-title {
      margin: 0 0 10px;
      font-size: 14px;
      line-height: 1.3;
    }

    .detail-section-note {
      margin: -4px 0 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .card {
      min-width: 0;
      max-width: 100%;
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(255,255,255,0.92);
      padding: 14px 14px 16px;
      overflow: visible;
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 14px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .status-card-body {
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    .status-badge-row {
      display: flex;
      flex-wrap: wrap;
      row-gap: 8px;
      column-gap: 6px;
      align-items: flex-start;
      min-width: 0;
    }

    .status-note {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .card .note {
      margin: -4px 0 10px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .kv {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .kv-row {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      font-size: 12px;
      line-height: 1.55;
      min-width: 0;
    }

    .kv-key {
      color: var(--muted);
    }

    .kv-value {
      min-width: 0;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .list {
      display: grid;
      gap: 8px;
    }

    .list-item {
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      background: rgba(248, 250, 252, 0.90);
      font-size: 12px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      word-break: break-word;
      min-width: 0;
    }

    .list-item:last-child {
      margin-bottom: 2px;
    }

    .link-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 0;
      max-width: 100%;
    }

    .link-chip {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(255,255,255,0.94);
      font-size: 12px;
      line-height: 1.3;
      color: var(--text);
      overflow-wrap: anywhere;
      word-break: break-word;
      max-width: 100%;
      white-space: normal;
    }

    .mono {
      margin: 0;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.94);
      color: #e2e8f0;
      font-size: 11px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .empty {
      padding: 18px;
      border-radius: 16px;
      border: 1px dashed rgba(148, 163, 184, 0.32);
      background: rgba(248, 250, 252, 0.88);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }

    @media (min-width: 1200px) {
      .detail-panel {
        align-self: stretch;
        height: 100%;
        max-height: none;
      }
    }

    @media (max-width: 1199px) {
      body { overflow: auto; }
      .app {
        height: auto;
        min-height: 100%;
      }
      .hero {
        grid-template-columns: 1fr;
      }
      .main {
        grid-template-columns: 1fr;
      }
      .detail-panel {
        height: auto;
        max-height: none;
        overflow: visible;
      }
      .graph-panel {
        min-height: 72vh;
      }
    }

    @media (max-width: 720px) {
      .hero-stats {
        grid-template-columns: 1fr;
      }
      .graph-head {
        flex-direction: column;
      }
      .graph-actions {
        justify-content: flex-start;
      }
      .kv-row {
        grid-template-columns: 1fr;
        gap: 4px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="hero-copy">
        <div class="eyebrow">workflow viewer</div>
        <h1 class="title" id="pageTitle">Ping不通故障定位-检查Ping命令是否合理</h1>
        <p class="subtitle" id="pageSubtitle">workflows/ping_unreachable/workflow.yaml</p>
        <div class="meta-row" id="metaRow"></div>
        <details class="start-fold" id="startFold">
          <summary id="startSummary">0 个起点</summary>
          <div class="start-list" id="startList"></div>
        </details>
      </div>
      <div class="hero-stats" id="heroStats"></div>
    </header>

    <main class="main">
      <section class="panel graph-panel">
        <div class="graph-head">
          <div>
            <p class="graph-head-title" id="graphHeadTitle">图谱概览</p>
            <p class="graph-head-note" id="graphHeadNote">点击任意节点或边，右侧会显示对应详情。当前节点状态和跳转语义是两套不同概念。</p>
          </div>
          <div class="graph-actions">
            <button class="graph-btn" id="overviewBtn" type="button">全图</button>
            <button class="graph-btn" id="focusBtn" type="button">回到当前</button>
          </div>
        </div>
        <div class="graph-info" id="graphInfo"></div>
        <div class="graph-stage-shell">
          <div class="graph-viewport" id="graphViewport">
            <div class="graph-stage" id="graphStage">
              <svg class="graph-edge-layer" id="edgeLayer"></svg>
              <div class="graph-node-layer" id="nodeLayer"></div>
            </div>

  <script>
    const data = JSON.parse(document.getElementById('viewer-data').textContent);

    const nodeMap = new Map(data.nodes.map((node) => [node.id, node]));
    const edgeMap = new Map(data.edges.map((edge) => [edge.id, edge]));
    const incomingByNode = new Map();
    const outgoingByNode = new Map();
    const incomingEdgesByNode = new Map();
    const outgoingEdgesByNode = new Map();

    for (const edge of data.edges) {
      if (edge.source_exists && edge.target_exists) {
        if (!incomingByNode.has(edge.target)) incomingByNode.set(edge.target, []);
        if (!outgoingByNode.has(edge.source)) outgoingByNode.set(edge.source, []);
        if (!incomingEdgesByNode.has(edge.target)) incomingEdgesByNode.set(edge.target, []);
        if (!outgoingEdgesByNode.has(edge.source)) outgoingEdgesByNode.set(edge.source, []);
        incomingByNode.get(edge.target).push(edge.source);
        outgoingByNode.get(edge.source).push(edge.target);
        incomingEdgesByNode.get(edge.target).push(edge);
        outgoingEdgesByNode.get(edge.source).push(edge);
      }
    }

    const state = {
      mode: 'focus',
      selectedType: 'node',
      selectedId: data.meta.default_node_id || data.nodes[0]?.id || '',
      lastType: 'node',
      lastId: data.meta.default_node_id || data.nodes[0]?.id || '',
      transform: { x: 0, y: 0, scale: 1 },
      drag: null,
    };

    const pageTitle = document.getElementById('pageTitle');
    const pageSubtitle = document.getElementById('pageSubtitle');
    const metaRow = document.getElementById('metaRow');
    const startFold = document.getElementById('startFold');
    const startSummary = document.getElementById('startSummary');
    const startList = document.getElementById('startList');
    const heroStats = document.getElementById('heroStats');
    const graphHeadTitle = document.getElementById('graphHeadTitle');
    const graphHeadNote = document.getElementById('graphHeadNote');
    const graphInfo = document.getElementById('graphInfo');
    const detailPanel = document.getElementById('detailPanel');
    const overviewBtn = document.getElementById('overviewBtn');
    const focusBtn = document.getElementById('focusBtn');
    const graphViewport = document.getElementById('graphViewport');
    const graphStage = document.getElementById('graphStage');
    const edgeLayer = document.getElementById('edgeLayer');
    const nodeLayer = document.getElementById('nodeLayer');

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function statusMeta(node) {
      const counts = node.issue_counts || {};
      if ((counts.critical || 0) > 0) return { key: 'critical', label: `严重 ${counts.critical}`, tone: 'critical' };
      if ((counts.warning || 0) > 0) return { key: 'warning', label: `警告 ${counts.warning}`, tone: 'warning' };
      if ((counts.info || 0) > 0) return { key: 'info', label: `提示 ${counts.info}`, tone: 'info' };
      return { key: 'neutral', label: '正常', tone: 'neutral' };
    }

    function routeTone(routeType) {
      if (routeType === 'default') return 'neutral';
      return 'primary';
    }

    function routeLabel(routeType) {
      if (routeType === 'default') return 'default';
      if (routeType === 'on_error') return 'on_error';
      return 'rule';
    }

    function routeTarget(item) {
      return item?.target || item?.next_node || '';
    }

    function renderIssueItems(items) {
      if (!items || !items.length) {
        return '<div class="empty">当前节点没有可展示的独立问题。</div>';
      }
      return `
        <div class="list">
          ${items.map((item) => `
            <div class="list-item">
              <div class="badge-row" style="margin-bottom:6px;">
                <span class="badge ${item.severity === 'critical' ? 'critical' : item.severity === 'warning' ? 'warning' : 'info'}">${escapeHtml(item.severity === 'critical' ? '严重' : item.severity === 'warning' ? '警告' : '提示')}</span>
                ${item.category ? `<span class="badge neutral">${escapeHtml(item.category)}</span>` : ''}
                ${item.line ? `<span class="badge neutral">line ${escapeHtml(item.line)}</span>` : ''}
              </div>
              <strong>${escapeHtml(item.message || '问题')}</strong>
              ${item.path ? `<div class="note" style="margin:6px 0 0;">${escapeHtml(item.path)}</div>` : ''}
              ${item.recommendation ? `<div class="note" style="margin:6px 0 0;">${escapeHtml(item.recommendation)}</div>` : ''}
            </div>
          `).join('')}
        </div>
      `;
    }

    function routeBadgeTone(routeType) {
      const tone = routeTone(routeType);
      if (tone === 'warning') return 'warning';
      if (tone === 'primary') return 'primary';
      return 'neutral';
    }

    function arrayText(values, emptyText = '无') {
      const list = (values || []).filter(Boolean).map(escapeHtml);
      return list.length ? list.join(' · ') : escapeHtml(emptyText);
    }

    function nodeLabel(node) {
      return node.kind === 'conclusion' ? '结论' : '步骤';
    }

    function currentNode() {
      return nodeMap.get(state.selectedId) || null;
    }

    function currentEdge() {
      return edgeMap.get(state.selectedId) || null;
    }

    function gatherFocus(type, id) {
      const relatedNodeIds = new Set();
      const relatedEdgeIds = new Set();

      if (type === 'node') {
        relatedNodeIds.add(id);
        for (const src of incomingByNode.get(id) || []) relatedNodeIds.add(src);
        for (const tgt of outgoingByNode.get(id) || []) relatedNodeIds.add(tgt);
        for (const edge of incomingEdgesByNode.get(id) || []) relatedEdgeIds.add(edge.id);
        for (const edge of outgoingEdgesByNode.get(id) || []) relatedEdgeIds.add(edge.id);
      } else if (type === 'edge') {
        const edge = edgeMap.get(id);
        if (!edge) return { relatedNodeIds, relatedEdgeIds };
        relatedEdgeIds.add(edge.id);
        relatedNodeIds.add(edge.source);
        relatedNodeIds.add(edge.target);
        for (const src of incomingByNode.get(edge.source) || []) relatedNodeIds.add(src);
        for (const tgt of outgoingByNode.get(edge.target) || []) relatedNodeIds.add(tgt);
        for (const e of incomingEdgesByNode.get(edge.source) || []) relatedEdgeIds.add(e.id);
        for (const e of outgoingEdgesByNode.get(edge.target) || []) relatedEdgeIds.add(e.id);
      }

      return { relatedNodeIds, relatedEdgeIds };
    }

    function rectForNode(node) {
      const layout = node.graph_layout || {};
      return {
        x1: layout.x ?? 0,
        y1: layout.y ?? 0,
        x2: (layout.x ?? 0) + (layout.width ?? 0),
        y2: (layout.y ?? 0) + (layout.height ?? 0),
        cx: layout.center_x ?? ((layout.x ?? 0) + (layout.width ?? 0) / 2),
        cy: layout.center_y ?? ((layout.y ?? 0) + (layout.height ?? 0) / 2),
      };
    }

    function mergeBounds(bounds, rect) {
      if (!rect) return bounds;
      if (!bounds) return { ...rect };
      return {
        x1: Math.min(bounds.x1, rect.x1),
        y1: Math.min(bounds.y1, rect.y1),
        x2: Math.max(bounds.x2, rect.x2),
        y2: Math.max(bounds.y2, rect.y2),
        cx: (Math.min(bounds.x1, rect.x1) + Math.max(bounds.x2, rect.x2)) / 2,
        cy: (Math.min(bounds.y1, rect.y1) + Math.max(bounds.y2, rect.y2)) / 2,
      };
    }

    function boundsForSelection(type, id) {
      if (type === 'node') {
        const node = nodeMap.get(id);
        if (!node) return null;
        const focus = gatherFocus('node', id);
        let bounds = null;
        for (const nodeId of focus.relatedNodeIds) {
          const item = nodeMap.get(nodeId);
          if (item && item.graph_layout) bounds = mergeBounds(bounds, rectForNode(item));
        }
        if (!bounds) bounds = rectForNode(node);
        return bounds;
      }
      if (type === 'edge') {
        const edge = edgeMap.get(id);
        if (!edge) return null;
        let bounds = null;
        for (const nodeId of gatherFocus('edge', id).relatedNodeIds) {
          const item = nodeMap.get(nodeId);
          if (item && item.graph_layout) bounds = mergeBounds(bounds, rectForNode(item));
        }
        if (bounds) return bounds;
        const source = nodeMap.get(edge.source);
        const target = nodeMap.get(edge.target);
        if (source && target) {
          bounds = mergeBounds(rectForNode(source), rectForNode(target));
          return bounds;
        }
      }
      return null;
    }

    function graphBounds() {
      let bounds = null;
      for (const node of data.nodes) {
        if (node.graph_layout) bounds = mergeBounds(bounds, rectForNode(node));
      }
      return bounds;
    }

    function setTransform(x, y, scale) {
      state.transform = { x, y, scale };
      graphStage.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
    }

    function clampScale(scale) {
      return Math.max(0.24, Math.min(1.4, scale));
    }

    function normalizeWheelDelta(event) {
      const multiplier = event.deltaMode === WheelEvent.DOM_DELTA_LINE
        ? 16
        : event.deltaMode === WheelEvent.DOM_DELTA_PAGE
          ? Math.max(graphViewport.clientHeight || 1, 800)
          : 1;
      return {
        x: event.deltaX * multiplier,
        y: event.deltaY * multiplier,
      };
    }

    function zoomAt(pointerX, pointerY, nextScale) {
      const currentScale = state.transform.scale;
      const clamped = clampScale(nextScale);
      const worldX = (pointerX - state.transform.x) / currentScale;
      const worldY = (pointerY - state.transform.y) / currentScale;
      const nextX = pointerX - worldX * clamped;
      const nextY = pointerY - worldY * clamped;
      setTransform(nextX, nextY, clamped);
    }

    function panBy(deltaX, deltaY) {
      setTransform(
        state.transform.x - deltaX,
        state.transform.y - deltaY,
        state.transform.scale
      );
    }

    function fitToBounds(bounds, { minScale = 0.32, maxScale = 1.2, pad = 72, center = null } = {}) {
      const viewportW = graphViewport.clientWidth || 1;
      const viewportH = graphViewport.clientHeight || 1;
      const width = Math.max(bounds.x2 - bounds.x1, 1);
      const height = Math.max(bounds.y2 - bounds.y1, 1);
      const scale = Math.max(
        minScale,
        Math.min(maxScale, Math.min((viewportW - pad * 2) / width, (viewportH - pad * 2) / height))
      );
      const cx = center?.x ?? bounds.cx;
      const cy = center?.y ?? bounds.cy;
      const x = viewportW / 2 - cx * scale;
      const y = viewportH / 2 - cy * scale;
      setTransform(x, y, scale);
    }

    function focusToNode(node, bounds, { minScale = 0.82, maxScale = 1.18, pad = 92 } = {}) {
      if (!node || !node.graph_layout) return;
      const layout = node.graph_layout;
      const viewportW = graphViewport.clientWidth || 1;
      const viewportH = graphViewport.clientHeight || 1;
      const focusX = layout.center_x ?? (layout.x + layout.width / 2);
      const focusY = layout.center_y ?? (layout.y + layout.height / 2);
      const safeScale = Math.max(
        minScale,
        Math.min(maxScale, Math.min(
          (viewportW - pad * 2) / Math.max((bounds?.x2 ?? layout.x + layout.width) - (bounds?.x1 ?? layout.x), 1),
          (viewportH - pad * 2) / Math.max((bounds?.y2 ?? layout.y + layout.height) - (bounds?.y1 ?? layout.y), 1)
        ))
      );
      const x = viewportW / 2 - focusX * safeScale;
      const y = viewportH / 2 - focusY * safeScale;
      setTransform(x, y, safeScale);
    }

    function focusSelection(type, id, { keepMode = true } = {}) {
      if (!id) {
        showOverview();
        return;
      }
      state.selectedType = type;
      state.selectedId = id;
      state.lastType = type;
      state.lastId = id;
      if (keepMode) state.mode = 'focus';
      const bounds = boundsForSelection(type, id) || graphBounds();
      if (type === 'node') {
        focusToNode(nodeMap.get(id), bounds, { minScale: 0.82, maxScale: 1.18, pad: 92 });
      } else if (type === 'edge') {
        const edge = edgeMap.get(id);
        const source = edge ? nodeMap.get(edge.source) : null;
        const target = edge ? nodeMap.get(edge.target) : null;
        const center = source && target ? {
          x: (source.graph_layout.center_x + target.graph_layout.center_x) / 2,
          y: (source.graph_layout.center_y + target.graph_layout.center_y) / 2,
        } : null;
        fitToBounds(bounds, { minScale: 0.82, maxScale: 1.18, pad: 92, center });
      } else {
        fitToBounds(bounds, { minScale: 0.82, maxScale: 1.18, pad: 92 });
      }
      render();
    }

    function focusNodeById(nodeId, { keepMode = true } = {}) {
      const node = nodeMap.get(nodeId);
      if (!node) return;
      state.selectedType = 'node';
      state.selectedId = nodeId;
      state.lastType = 'node';
      state.lastId = nodeId;
      if (keepMode) state.mode = 'focus';
      const bounds = boundsForSelection('node', nodeId) || graphBounds();
      focusToNode(node, bounds, { minScale: 0.82, maxScale: 1.18, pad: 92 });
      render();
    }

    function showOverview() {
      state.mode = 'overview';
      state.selectedType = '';
      state.selectedId = '';
      const bounds = graphBounds() || { x1: 0, y1: 0, x2: data.graph.width, y2: data.graph.height, cx: data.graph.width / 2, cy: data.graph.height / 2 };
      fitToBounds(bounds, { minScale: 0.30, maxScale: 0.92, pad: 56 });
      render();
    }

    function restoreFocus() {
      if (state.lastId && nodeMap.has(state.lastId)) {
        focusSelection(state.lastType, state.lastId);
        return;
      }
      focusSelection('node', data.meta.default_node_id || data.nodes[0]?.id || '', { keepMode: true });
    }

    function buildGraphInfo() {
      if (state.mode === 'overview' || !state.selectedId) {
        return [
          `当前：全图概览`,
          `默认起点：${escapeHtml((data.meta.start_nodes || []).slice(0, 2).join(' · ') || '无')}`,
          `节点状态 / 跳转语义分开表达`,
        ];
      }
      const selected = nodeMap.get(state.selectedId) || edgeMap.get(state.selectedId);
      if (!selected) return [];
      if (state.selectedType === 'node') {
        const node = selected;
        const status = statusMeta(node);
        return [
          `当前节点：${escapeHtml(node.id)}`,
          `状态：${escapeHtml(status.label)}`,
          `相关节点：${Math.max(gatherFocus('node', node.id).relatedNodeIds.size - 1, 0).toString()} 个`,
        ];
      }
      const edge = selected;
      return [
        `当前边：${escapeHtml(edge.route_label || routeLabel(edge.route_type))}`,
        `来源：${escapeHtml(edge.source)}`,
        `目标：${escapeHtml(edge.target || '未解析')}`,
        `语义：${escapeHtml(edge.route_type)}`,
      ];
    }

    function renderHeader() {
      pageTitle.textContent = data.meta.name || 'workflow viewer';
      pageSubtitle.textContent = `${data.meta.workflow_path} · ${data.meta.steps_dir} · ${data.meta.generated_at}`;
      metaRow.innerHTML = '';
      const metaItems = [
        ['workflow_id', data.meta.workflow_id || 'N/A'],
        ['当前默认焦点', data.meta.default_node_id || '无'],
      ];
      for (const [label, value] of metaItems) {
        const pill = document.createElement('span');
        pill.className = 'pill neutral';
        pill.textContent = `${label}: ${value}`;
        metaRow.appendChild(pill);
      }

      const startNodes = data.meta.start_nodes || [];
      if (startFold && startSummary && startList) {
        startSummary.textContent = `${startNodes.length} 个起点`;
        startList.innerHTML = startNodes.length
          ? startNodes.map((id) => `<span class="pill neutral">${escapeHtml(id)}</span>`).join('')
          : '<span class="pill neutral">无起点</span>';
      }

      const counts = [
        { value: data.meta.step_count, label: '步骤节点' },
        { value: data.meta.edge_count, label: '跳转边' },
        { value: data.issue_summary?.total || 0, label: '问题总数', tone: 'warning' },
      ];
      heroStats.innerHTML = counts.map((item) => `
        <div class="stat">
          <div class="stat-value">${escapeHtml(item.value)}</div>
          <div class="stat-label">${escapeHtml(item.label)}</div>
        </div>
      `).join('');

      graphHeadTitle.textContent = state.mode === 'overview' ? '全图概览' : '聚焦当前节点';
      graphHeadNote.textContent = state.mode === 'overview'
        ? '先看整体结构，再点节点或边查看局部。'
        : '当前节点居中，直接相关内容高亮，其他内容降噪。';
      graphInfo.innerHTML = buildGraphInfo().map((text) => `<span class="pill neutral">${text}</span>`).join('');
    }

    function renderDetailOverview() {
      const totalIssues = data.issue_summary?.total || 0;
      const critical = data.issue_summary?.global?.critical || 0;
      const warning = data.issue_summary?.global?.warning || 0;
      const info = data.issue_summary?.global?.info || 0;
      const topGroups = (data.groups || []).slice(0, 4);
      return `
        <div class="detail-head">
          <h2>${escapeHtml(data.meta.name || 'Workflow 概览')}</h2>
          <p>这是一个单页 workflow 图查看器。先看主干，再点击节点或边查看局部。节点问题态与跳转语义分开表达，避免混淆。</p>
        </div>
        <div class="detail-stack">
          <div class="detail-banner info">总问题数 ${escapeHtml(totalIssues)}，其中严重 ${escapeHtml(critical)}、警告 ${escapeHtml(warning)}、提示 ${escapeHtml(info)}。</div>
          <div class="card">
            <h3>怎么用</h3>
            <div class="list">
              <div class="list-item">点击节点查看节点详情、上下游关系和问题信息。</div>
              <div class="list-item">点击边查看跳转条件、跳转语义和来源/目标节点。</div>
              <div class="list-item">使用“全图 / 回到当前”切换整体概览与局部聚焦。</div>
            </div>
          </div>
          <div class="card">
            <h3>阶段概览</h3>
            <div class="list">
              ${topGroups.map((group) => `
                <div class="list-item">
                  <strong>${escapeHtml(group.title)}</strong><br />
                  ${escapeHtml(group.description)}<br />
                  节点 ${escapeHtml(group.step_ids.length)} · 严重 ${escapeHtml(group.issue_counts.critical)} · 警告 ${escapeHtml(group.issue_counts.warning)}
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderNodeDetail(node) {
      const status = statusMeta(node);
      const incoming = node.incoming_ids || [];
      const outgoing = node.outgoing_ids || [];
      const outgoingRoutes = node.outgoing_routes || [];
      const unresolvedRoutes = (node.transitions || []).filter((item) => item.next_node && !nodeMap.has(item.next_node));
      const explanation = node.content || node.repair_action || node.suggestion || '无';
      const routeItems = (outgoingRoutes.length ? outgoingRoutes : node.transitions || []).map((item) => ({
        ...item,
        target_node: routeTarget(item),
      }));

      return `
        <div class="detail-head">
          <h2>${escapeHtml(node.title)}</h2>
          <p>${escapeHtml(node.id)} · ${escapeHtml(nodeLabel(node))} · ${escapeHtml(node.file_path || 'N/A')}</p>
        </div>
        <div class="detail-stack">
          <div class="card">
            <h3 class="detail-section-title">节点状态</h3>
            <div class="status-card-body">
              <div class="status-badge-row">
                <span class="badge ${status.tone}">${escapeHtml(status.label)}</span>
                <span class="badge neutral">严重 ${escapeHtml(node.issue_counts?.critical || 0)}</span>
                <span class="badge neutral">警告 ${escapeHtml(node.issue_counts?.warning || 0)}</span>
                <span class="badge neutral">提示 ${escapeHtml(node.issue_counts?.info || 0)}</span>
              </div>
              <p class="status-note">这部分只描述节点健康情况，与流程跳转规则分开看。</p>
            </div>
          </div>

          ${node.issue_items && node.issue_items.length ? `
            <div class="card">
              <h3 class="detail-section-title">问题详情</h3>
              <p class="detail-section-note">这里只列出 report.md 中标出的严重 / 警告 / 提示问题。</p>
              ${renderIssueItems(node.issue_items)}
            </div>
          ` : ''}

          <div class="card">
            <h3>基本信息</h3>
            <div class="kv">
              <div class="kv-row"><div class="kv-key">类型</div><div class="kv-value">${escapeHtml(node.kind === 'conclusion' ? '结论节点' : '步骤节点')}</div></div>
              <div class="kv-row"><div class="kv-key">文件</div><div class="kv-value">${escapeHtml(node.file_path || 'N/A')}</div></div>
              <div class="kv-row"><div class="kv-key">阶段</div><div class="kv-value">${escapeHtml(node.group_title || 'N/A')} · ${escapeHtml(node.group_range || '')}</div></div>
              <div class="kv-row"><div class="kv-key">说明</div><div class="kv-value">${escapeHtml(explanation)}</div></div>
            </div>
          </div>

          <div class="card">
            <h3 class="detail-section-title">上下游关系</h3>
            <div class="kv">
              <div class="kv-row"><div class="kv-key">上游</div><div class="kv-value">${incoming.length ? `<div class="link-row">${incoming.map((id) => `<button class="link-chip" type="button" data-node-jump="${escapeHtml(id)}">${escapeHtml(id)}</button>`).join('')}</div>` : '无'}</div></div>
              <div class="kv-row"><div class="kv-key">下游</div><div class="kv-value">${outgoing.length ? `<div class="link-row">${outgoing.map((id) => `<button class="link-chip" type="button" data-node-jump="${escapeHtml(id)}">${escapeHtml(id)}</button>`).join('')}</div>` : '无'}</div></div>
            </div>
          </div>

          <div class="card">
            <h3 class="detail-section-title">跳转规则</h3>
            <p class="detail-section-note">这里展示的是路由语义，不代表节点严重度。</p>
            <div class="list">
              ${routeItems.map((item) => `
                <div class="list-item">
                  <div class="badge-row" style="margin-bottom:6px;">
                    <span class="badge ${routeBadgeTone(item.route_type)}">${escapeHtml(routeLabel(item.route_type))}</span>
                    ${item.target_node ? `<span class="badge neutral">next: ${escapeHtml(item.target_node)}</span>` : `<span class="badge warning">next 未解析</span>`}
                  </div>
                  <strong>${escapeHtml(item.description || '规则')}</strong><br />
                  ${escapeHtml(item.condition || '无条件')}${item.route_type === 'default' ? '<br />默认分支' : ''}
                </div>
              `).join('')}
            </div>
          </div>

          <div class="card">
            <h3 class="detail-section-title">未解析跳转</h3>
            ${unresolvedRoutes.length ? `
              <div class="list">
                ${unresolvedRoutes.map((item) => `
                  <div class="list-item">
                    <span class="badge warning">未解析目标</span>
                    <div style="margin-top:6px;"><strong>${escapeHtml(item.description || '规则')}</strong></div>
                    <div>${escapeHtml(item.condition || '无条件')}</div>
                    <div class="mono" style="margin-top:8px;">next: ${escapeHtml(item.next_node)}</div>
                  </div>
                `).join('')}
              </div>
            ` : '<div class="empty">当前节点没有未解析跳转。</div>'}
          </div>

          <div class="card">
            <h3 class="detail-section-title">相关技能</h3>
            ${node.skills && node.skills.length ? `<div class="badge-row">${node.skills.map((skill) => `<span class="badge primary">${escapeHtml(skill)}</span>`).join('')}</div>` : '<div class="empty">没有显式技能信息。</div>'}
          </div>
        </div>
      `;
    }

    function renderEdgeDetail(edge) {
      const source = nodeMap.get(edge.source);
      const target = nodeMap.get(edge.target);
      return `
        <div class="detail-head">
          <h2>${escapeHtml(edge.route_label || routeLabel(edge.route_type))}</h2>
          <p>${escapeHtml(edge.source)} → ${escapeHtml(edge.target || '未解析')}</p>
        </div>
        <div class="detail-stack">
          <div class="card">
            <h3 class="detail-section-title">跳转语义</h3>
            <div class="badge-row">
              <span class="badge ${routeBadgeTone(edge.route_type)}">${escapeHtml(routeLabel(edge.route_type))}</span>
              <span class="badge neutral">来源: ${escapeHtml(edge.source)}</span>
              <span class="badge neutral">目标: ${escapeHtml(edge.target || '未解析')}</span>
            </div>
            <p class="detail-section-note">这只是流程路由信息，不表示节点严重度。</p>
          </div>

          <div class="card">
            <h3 class="detail-section-title">规则与条件</h3>
            <div class="kv">
              <div class="kv-row"><div class="kv-key">说明</div><div class="kv-value">${escapeHtml(edge.description || '无')}</div></div>
              <div class="kv-row"><div class="kv-key">条件</div><div class="kv-value">${escapeHtml(edge.condition || '无条件 / default')}</div></div>
              <div class="kv-row"><div class="kv-key">类型</div><div class="kv-value">${escapeHtml(edge.route_type)}</div></div>
            </div>
          </div>

          <div class="card">
            <h3 class="detail-section-title">连接节点</h3>
            <div class="kv">
              <div class="kv-row"><div class="kv-key">起点</div><div class="kv-value">${source ? `<button class="link-chip" type="button" data-node-jump="${escapeHtml(source.id)}">${escapeHtml(source.title)}</button>` : '未找到'}</div></div>
              <div class="kv-row"><div class="kv-key">终点</div><div class="kv-value">${target ? `<button class="link-chip" type="button" data-node-jump="${escapeHtml(target.id)}">${escapeHtml(target.title)}</button>` : '未解析'}</div></div>
            </div>
          </div>
        </div>
      `;
    }

    function renderOverviewDetail() {
      detailPanel.innerHTML = renderDetailOverview();
    }

    function renderSelectedDetail() {
      if (state.mode === 'overview' || !state.selectedId) {
        renderOverviewDetail();
        return;
      }
      if (state.selectedType === 'node') {
        const node = nodeMap.get(state.selectedId);
        detailPanel.innerHTML = node ? renderNodeDetail(node) : renderDetailOverview();
        return;
      }
      const edge = edgeMap.get(state.selectedId);
      detailPanel.innerHTML = edge ? renderEdgeDetail(edge) : renderDetailOverview();
    }

    function createNodeHtml(node) {
      const status = statusMeta(node);
      const isSelected = state.selectedType === 'node' && state.selectedId === node.id;
      const isRelated = state.mode === 'focus' && state.selectedType && gatherFocus(state.selectedType, state.selectedId).relatedNodeIds.has(node.id);
      const isMuted = state.mode === 'focus' && state.selectedType && !isRelated;
      const classes = [
        'graph-node',
        node.kind,
        `status-${status.key}`,
        isSelected ? 'selected' : '',
        isSelected ? 'focus' : '',
        isRelated && !isSelected ? 'related' : '',
        isMuted ? 'muted' : '',
      ].filter(Boolean).join(' ');
      const layout = node.graph_layout;
      const currentBadge = isSelected ? `<span class="badge primary">当前</span>` : '';
      const statusBadge = `<span class="badge ${status.tone}">${escapeHtml(status.label)}</span>`;
      return `
        <button
          class="${classes}"
          type="button"
          data-node-id="${escapeHtml(node.id)}"
          style="left:${layout.x}px;top:${layout.y}px;width:${layout.width}px;min-height:${layout.height}px;"
          aria-label="${escapeHtml(node.title)}"
        >
          <div class="node-top">
            <span>${escapeHtml(nodeLabel(node))}</span>
            <span>${escapeHtml(node.group_title || node.kind)}</span>
          </div>
          <h3 class="node-title">${escapeHtml(node.title)}</h3>
          <div class="badge-row">
            ${statusBadge}
            ${currentBadge}
          </div>
        </button>
      `;
    }

    function edgeLabelText(edge) {
      return edge.route_label || edge.description || routeLabel(edge.route_type);
    }

    function shouldShowEdgeLabel(edge, isSelected, related) {
      if (!edge.path) return false;
      if (isSelected || related) return true;
      if (state.mode === 'overview') {
        return (edge.lane_total || 1) <= 2 || edge.route_type === 'default';
      }
      return false;
    }

    function buildSvgEdge(edge) {
      const isSelected = state.selectedType === 'edge' && state.selectedId === edge.id;
      let related = false;
      if (state.mode === 'focus') {
        if (state.selectedType === 'node') {
          related = gatherFocus('node', state.selectedId).relatedEdgeIds.has(edge.id);
        } else if (state.selectedType === 'edge') {
          related = gatherFocus('edge', state.selectedId).relatedEdgeIds.has(edge.id);
        }
      }
      const muted = state.mode === 'focus' && state.selectedType && !related && !isSelected;
      const classes = ['graph-edge', isSelected ? 'selected' : '', related && !isSelected ? 'related' : '', muted ? 'muted' : ''].filter(Boolean).join(' ');
      const line = edge.path
        ? `<path class="edge-line" d="${escapeHtml(edge.path)}"></path>`
        : '';
      const hit = edge.path
        ? `<path class="edge-hit" data-edge-id="${escapeHtml(edge.id)}" d="${escapeHtml(edge.path)}"></path>`
        : '';
      const showLabel = shouldShowEdgeLabel(edge, isSelected, related);
      const label = showLabel
        ? `
          <g class="edge-label" transform="translate(${edge.label_x}, ${edge.label_y})">
            <rect x="${Math.max(-22, -12 - edgeLabelText(edge).length * 2.8)}" y="-12" width="${Math.min(176, Math.max(54, edgeLabelText(edge).length * 6.6))}" height="20" rx="8"></rect>
            <text text-anchor="middle" dominant-baseline="middle">${escapeHtml(edgeLabelText(edge))}</text>
          </g>
        `
        : '';
      return `
        <g class="${classes}" data-edge-id="${escapeHtml(edge.id)}">
          ${line}
          ${hit}
          ${label}
        </g>
      `;
    }

    function renderGraph() {
      const stageWidth = data.graph.width || 1200;
      const stageHeight = data.graph.height || 800;
      graphStage.style.width = `${stageWidth}px`;
      graphStage.style.height = `${stageHeight}px`;
      edgeLayer.setAttribute('viewBox', `0 0 ${stageWidth} ${stageHeight}`);
      edgeLayer.setAttribute('width', `${stageWidth}`);
      edgeLayer.setAttribute('height', `${stageHeight}`);
      edgeLayer.setAttribute('preserveAspectRatio', 'none');
      edgeLayer.innerHTML = data.edges.map(buildSvgEdge).join('');
      nodeLayer.innerHTML = data.nodes.map(createNodeHtml).join('');
    }

    function updateClasses() {
      const focusSet = state.mode === 'focus' && state.selectedId
        ? gatherFocus(state.selectedType, state.selectedId)
        : { relatedNodeIds: new Set(), relatedEdgeIds: new Set() };
      nodeLayer.querySelectorAll('.graph-node').forEach((el) => {
        const node = nodeMap.get(el.dataset.nodeId);
        if (!node) return;
        const isSelected = state.selectedType === 'node' && state.selectedId === node.id;
        const isRelated = state.mode === 'focus' && state.selectedType && focusSet.relatedNodeIds.has(node.id);
        el.classList.toggle('selected', isSelected);
        el.classList.toggle('focus', isSelected);
        el.classList.toggle('related', isRelated && !isSelected);
        el.classList.toggle('muted', state.mode === 'focus' && state.selectedType && !isRelated && !isSelected);
      });
      edgeLayer.querySelectorAll('.graph-edge').forEach((el) => {
        const edge = edgeMap.get(el.dataset.edgeId);
        if (!edge) return;
        const isSelected = state.selectedType === 'edge' && state.selectedId === edge.id;
        const isRelated = state.mode === 'focus' && state.selectedType && focusSet.relatedEdgeIds.has(edge.id);
        el.classList.toggle('selected', isSelected);
        el.classList.toggle('related', isRelated && !isSelected);
        el.classList.toggle('muted', state.mode === 'focus' && state.selectedType && !isRelated && !isSelected);
      });
    }

    function render() {
      renderGraph();
      renderHeader();
      renderSelectedDetail();
      updateClasses();
      graphInfo.innerHTML = buildGraphInfo().map((text) => `<span class="pill neutral">${text}</span>`).join('');
    }

    function selectNode(nodeId) {
      if (!nodeMap.has(nodeId)) return;
      focusNodeById(nodeId);
    }

    function selectEdge(edgeId) {
      if (!edgeMap.has(edgeId)) return;
      state.selectedType = 'edge';
      state.selectedId = edgeId;
      state.lastType = 'edge';
      state.lastId = edgeId;
      state.mode = 'focus';
      const edge = edgeMap.get(edgeId);
      const source = nodeMap.get(edge.source);
      const target = nodeMap.get(edge.target);
      const bounds = source && target ? mergeBounds(rectForNode(source), rectForNode(target)) : boundsForSelection('edge', edgeId) || graphBounds();
      const center = source && target ? {
        x: (source.graph_layout.center_x + target.graph_layout.center_x) / 2,
        y: (source.graph_layout.center_y + target.graph_layout.center_y) / 2,
      } : null;
      fitToBounds(bounds, { minScale: 0.80, maxScale: 1.14, pad: 92, center });
      render();
    }

    function resetFocus() {
      const targetType = state.lastType || 'node';
      const targetId = state.lastId || data.meta.default_node_id || data.nodes[0]?.id || '';
      if (targetType === 'node' && targetId) {
        focusNodeById(targetId);
        return;
      }
      focusSelection(targetType, targetId);
    }

    function setupListeners() {
      nodeLayer.addEventListener('click', (event) => {
        const target = event.target.closest('[data-node-id]');
        if (!target) return;
        selectNode(target.dataset.nodeId);
      });

      edgeLayer.addEventListener('click', (event) => {
        const target = event.target.closest('[data-edge-id]');
        if (!target) return;
        selectEdge(target.dataset.edgeId);
      });

      detailPanel.addEventListener('click', (event) => {
        const target = event.target.closest('[data-node-jump]');
        if (!target) return;
        selectNode(target.dataset.nodeJump);
      });

      overviewBtn.addEventListener('click', () => {
        state.mode = 'overview';
        state.selectedType = '';
        state.selectedId = '';
        fitToBounds(graphBounds() || { x1: 0, y1: 0, x2: data.graph.width, y2: data.graph.height, cx: data.graph.width / 2, cy: data.graph.height / 2 }, { minScale: 0.30, maxScale: 0.88, pad: 56 });
        render();
      });

      focusBtn.addEventListener('click', () => {
        resetFocus();
      });

      graphViewport.addEventListener('pointerdown', (event) => {
        if (event.target.closest('button, [data-node-id], [data-edge-id]')) return;
        graphViewport.setPointerCapture(event.pointerId);
        graphViewport.classList.add('dragging');
        state.drag = {
          startX: event.clientX,
          startY: event.clientY,
          originX: state.transform.x,
          originY: state.transform.y,
        };
      });

      graphViewport.addEventListener('pointermove', (event) => {
        if (!state.drag) return;
        const dx = event.clientX - state.drag.startX;
        const dy = event.clientY - state.drag.startY;
        setTransform(state.drag.originX + dx, state.drag.originY + dy, state.transform.scale);
      });

      graphViewport.addEventListener('pointerup', () => {
        state.drag = null;
        graphViewport.classList.remove('dragging');
      });

      graphViewport.addEventListener('pointercancel', () => {
        state.drag = null;
        graphViewport.classList.remove('dragging');
      });

      graphViewport.addEventListener('dblclick', (event) => {
        event.preventDefault();
      });

      graphViewport.addEventListener('wheel', (event) => {
        event.preventDefault();
        const rect = graphViewport.getBoundingClientRect();
        const pointerX = event.clientX - rect.left;
        const pointerY = event.clientY - rect.top;
        const { x: rawDeltaX, y: rawDeltaY } = normalizeWheelDelta(event);
        if (event.ctrlKey || event.metaKey) {
          const currentScale = state.transform.scale;
          const zoomFactor = Math.exp(-rawDeltaY * 0.0012);
          zoomAt(pointerX, pointerY, currentScale * zoomFactor);
          return;
        }
        const panX = event.shiftKey ? rawDeltaY : rawDeltaX;
        const panY = event.shiftKey ? 0 : rawDeltaY;
        if (Math.abs(panX) < 0.01 && Math.abs(panY) < 0.01) return;
        panBy(panX, panY);
      }, { passive: false });
    }

    function bindWindowResize() {
      let resizeTimer = 0;
      window.addEventListener('resize', () => {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(() => {
          if (state.mode === 'overview') {
            fitToBounds(graphBounds() || { x1: 0, y1: 0, x2: data.graph.width, y2: data.graph.height, cx: data.graph.width / 2, cy: data.graph.height / 2 }, { minScale: 0.28, maxScale: 0.86, pad: 64 });
          } else if (state.selectedId) {
            const bounds = boundsForSelection(state.selectedType, state.selectedId) || graphBounds();
            fitToBounds(bounds, { minScale: 0.72, maxScale: 1.12, pad: 84 });
          }
          render();
        }, 120);
      });
    }

    function initialize() {
      renderHeader();
      renderGraph();
      setupListeners();
      bindWindowResize();
      const firstId = state.selectedId || data.meta.default_node_id || data.nodes[0]?.id || '';
      if (firstId) {
        selectNode(firstId);
      } else {
        showOverview();
      }
    }

    initialize();
  </script>
</body>
</html>
